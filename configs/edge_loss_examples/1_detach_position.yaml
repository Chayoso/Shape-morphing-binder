# Edge Loss Mode 1: Detach Position (RECOMMENDED)
#
# This mode blocks the spurious dL/dx gradient path by detaching
# particle positions when computing the projection Jacobian.
#
# Use this as your default configuration.

input_mesh_path: "assets/isosphere.obj"
target_mesh_path: "assets/bunny.obj"
output_dir: "output/edge_modes/bunny/1_detach_position/"

simulation:
  grid_dx: 1
  points_per_cell_cuberoot: 3
  grid_min_point: [-16.0, -16.0, -16.0]
  grid_max_point: [16.0, 16.0, 16.0]
  lam: 38888.89
  mu: 58333.3
  density: 75.0
  dt: 0.00833333333
  drag: 0.5
  external_force: [0.0, 0.0, 0.0]
  smoothing_factor: 0.955

optimization:
  num_animations: 25
  num_timesteps: 10
  control_stride: 1
  max_gd_iters: 1
  max_ls_iters: 15
  initial_alpha: 0.01
  gd_tol: 0.0
  use_session_mode: false
  adaptive_alpha_enabled: true

  loss:
    enabled: true
    w_alpha: 0.0
    w_depth: 0.3
    w_photo: 0.0
    w_edge: 0.5              # Edge loss weight
    w_cov_align: 2.0
    w_cov_reg: 0.01
    w_det_barrier: 0.1
    cov_reg_mode: 'eigenvalue'
    schedule: 'constant'

    # 🔥 Edge loss configuration (Mode 1: Detach Position)
    edge_loss_mode: 'detach_position'     # RECOMMENDED: Blocks spurious dL/dx
    gradient_boost_factor: 1000.0         # Not used in detach_position mode
    debug_edge_gradients: false           # Set to true for diagnostics

  magnitude_strategy: 'normalize'

upsample:
  use_simple_pipeline: true
  render_loss_weight: 1e4

  covariance:
    use_curvature_for_target: true
    sigma_isotropic: 0.038
    curvature_sigma:
      sigma_n0: 0.1
      sigma_t0: 0.12
      a: 6.0
      b: 5.0
      a_n: 1.5
      u: 1.5
      k_floor_normal: 0.002
      k_floor_tangent: 0.005
    sigma0: 0.12
    k_F: 32
    use_multiscale_F: true
    k_F_coarse: 64
    k_F_fine: 16
    multiscale_blend_mode: 'adaptive'
    enable_subdivision: true
    subdivision_target: 100000
    subdivision_jitter: 0.15
    sv_min: 0.80
    sv_max: 1.20
    use_F_smoothing: false
    F_smooth:
      lambda_lap: 0.005
      num_nodes: 180
      node_knn: 8
      point_knn: 8

camera:
  width: 3840
  height: 2160
  fx: 1425.0
  fy: 1425.0
  cx: 1920.0
  cy: 1080.0
  znear: 0.01
  zfar: 100.0
  lookat:
    eye: [20.0, -25.0, 12.5]
    target: [0.0, 0.0, 0.0]
    up: [0.0, 0.0, 1.0]

render:
  num_frames: 1
  schedule: uniform
  bg: [1.0, 1.0, 1.0]
  training_resolution_scale: 1.0
  particle_color: [0.27, 0.51, 0.71]
  edge_proximity_percentile: 0.9  # 🔥 Surface particle ratio: 20% of particles marked as surface
  surface_mask_mode: 'first'  # 🔥 'first' or 'last' - which particles to mark as surface
  lighting:
    model: phong
    type: directional
    direction: [0.3, -0.5, 0.8]
    two_sided: true
    ambient: 0.18
    diffuse: 0.85
    specular: 0.10
    shininess: 32
