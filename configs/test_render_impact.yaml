# Quick test: Verify render_F_ratio impact on real run
# PPC=4 (lightweight), 10 episodes, lower resolution

input_mesh_path: "assets/bunny.obj"
target_mesh_path: "assets/isosphere.obj"
output_dir: "output/test_render_impact_surfweight/"

simulation:
  grid_dx: 1
  points_per_cell_cuberoot: 4
  grid_min_point: [-16.0, -16.0, -16.0]
  grid_max_point: [16.0, 16.0, 16.0]
  lam: 38888.89
  mu: 58333.3
  density: 75.0
  dt: 0.00833333333
  drag: 0.5
  external_force: [0.0, 0.0, 0.0]
  smoothing_factor: 0.955

optimization:
  num_animations: 10
  num_timesteps: 10
  control_stride: 1
  max_gd_iters: 1
  max_ls_iters: 15
  initial_alpha: 0.01
  gd_tol: 0.0
  use_session_mode: false
  adaptive_alpha_enabled: true
  num_passes: 2
  render_F_ratio: 20.0
  dfc_surface_tau: 0.1
  dfc_J_min_threshold: 0.3

  loss:
    enabled: true
    w_alpha: 2.0
    w_depth: 5.0
    w_photo: 1.0
    w_edge: 3.0
    w_cov_align: 0.0
    w_cov_reg: 0.01
    w_det_barrier: 0.1
    cov_reg_mode: 'eigenvalue'
    schedule: 'constant'
    edge_loss_mode: 'detach_position'
    gradient_boost_factor: 1000.0
    debug_edge_gradients: true

  magnitude_strategy: 'normalize'

upsample:
  use_simple_pipeline: true
  render_loss_weight: 1e2

  covariance:
    sigma_isotropic: 0.038
    sigma0: 0.06
    k_F: 32
    use_multiscale_F: true
    k_F_coarse: 64
    k_F_fine: 16
    multiscale_blend_mode: 'adaptive'
    enable_subdivision: false
    sv_min: 0.80
    sv_max: 1.20
    use_F_smoothing: false

camera:
  width: 960
  height: 540
  fx: 356.0
  fy: 356.0
  cx: 480.0
  cy: 270.0
  znear: 0.01
  zfar: 100.0
  lookat:
    eye: [20.0, -25.0, 12.5]
    target: [0.0, 0.0, 0.0]
    up: [0.0, 0.0, 1.0]

render:
  bg: [1.0, 1.0, 1.0]
  training_resolution_scale: 1.0
  particle_color: [0.27, 0.51, 0.71]
  surface_mask_ratio: 0.20
  surface_mask_mode: 'last'
  surface_masking:
    method: edge
    edge_percentile: 0.85
    edge_min_ratio: 0.2
    edge_min_points: 3000
    depth_threshold: 0.025
    depth_min_ratio: 0.05
  gradient_focus:
    visible_only: true
    min_ratio: 0.15
    min_points: 5000
    warn_ratio_min: 0.05
    warn_ratio_max: 0.6
    loss_masking: edge
  lighting:
    model: phong
    type: directional
    direction: [0.3, -0.5, 0.8]
    two_sided: true
    ambient: 0.18
    diffuse: 0.85
    specular: 0.10
    shininess: 32
