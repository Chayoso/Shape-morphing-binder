# E2E render gradient injection: Sphere → Bunny (40 episodes, PPC=5)

input_mesh_path:  "assets/isosphere.obj"
target_mesh_path: "assets/bunny.obj"
output_dir:       "output/e2e"

simulation:
  grid_dx: 1.0
  grid_min_point: [-16.0, -16.0, -16.0]
  grid_max_point: [16.0, 16.0, 16.0]
  points_per_cell_cuberoot: 5
  lam: 38888.89
  mu:  58333.3
  density: 75.0
  dt: 0.00833333333
  drag: 0.5
  external_force: [0.0, 0.0, 0.0]
  smoothing_factor: 0.955

optimization:
  num_animations: 40
  num_timesteps: 10
  control_stride: 1
  max_gd_iters: 1
  max_ls_iters: 10
  initial_alpha: 0.01
  gd_tol: 0.0001

e2e:
  enabled: true
  start_ep: 0
  render_weight: 1.0
  render_gain: 1.0

appearance:
  enabled: true
  n_surface_samples: 50000
  sigma_t: 0.4
  sigma_n: 0.08
  eta: 0.1
  eta_warmup: 0.5
  eta_warmup_eps: 5
  sv_min: 0.3
  sv_max: 3.0
  det_min: 0.5
  det_max: 2.0
  sv_elastic_min: 0.2
  dist_falloff: 2.0
  interior_sigma: 0.3

upsample:
  use_simple_pipeline: true
  covariance:
    sigma0: 0.08
    enable_subdivision: false
    use_F_smoothing: false

camera:
  width:  1920
  height: 1080
  fx: 712.5
  fy: 712.5
  cx: 960.0
  cy: 540.0
  znear: 0.01
  zfar:  100.0
  lookat:
    eye:    [20.0, -25.0, 12.5]
    target: [0.0, 0.0, 0.0]
    up:     [0.0, 0.0, 1.0]

render:
  bg: [1.0, 1.0, 1.0]
  training_resolution_scale: 0.5
  particle_color: [0.27, 0.51, 0.71]
  lighting:
    model: phong
    type: directional
    direction: [0.3, -0.5, 0.8]
    two_sided: true
    ambient:   0.18
    diffuse:   0.85
    specular:  0.10
    shininess: 32
