# ================================================================================
# PhysMorph-GS: Sphere to Spot Morphing Configuration
# ================================================================================
# Version: 3.1 (Clean)
# Date: 2025-10-29
# ================================================================================

# ================================================================================
# I/O Configuration
# ================================================================================
input_mesh_path: "assets/isosphere.obj"
target_mesh_path: "assets/spot.obj"
output_dir: "output/"

output:
  export_ply: true
  output_format: "ply"

# ================================================================================
# Physics Simulation (MPM)
# ================================================================================
simulation:
  grid_dx: 0.75
  points_per_cell_cuberoot: 3
  grid_min_point: [-16.0, -16.0, -16.0]
  grid_max_point: [16.0, 16.0, 16.0]
  
  lam: 38888.89
  mu: 58333.3
  density: 75.0
  
  dt: 0.00833333333
  drag: 0.5
  external_force: [0.0, 0.0, 0.0]
  smoothing_factor: 0.955

# ================================================================================
# Optimization
# ================================================================================
optimization:
  num_animations: 50
  num_timesteps: 10
  control_stride: 1
  
  max_gd_iters: 1
  max_ls_iters: 10
  initial_alpha: 0.01
  gd_tol: 0.0001
  
  loss:
    enabled: true
    w_alpha: 5000
    w_depth: 200
    w_edge: 3000
    w_cov_align: 10000
    w_coverage: 2000
    w_cov_reg: 0.01
    cov_reg_mode: 'eigenvalue'
    target_cov_scale: 0.02
    schedule: 'constant'

# ================================================================================
# Upsampling Pipeline
# ================================================================================
upsample:
  k_neighbors: 128
  
  # ------------------------------------------------------------------------------
  # Stage 1: Surface Detection
  # ------------------------------------------------------------------------------
  surface_detection:
    enabled: true
    k: 128
    planarity_percentile: 20.0
    soft_tau: 0.50
    surface_power: 6.0
    use_spacing_score: false
    spacing_weight: 0.0
    surface_n_sigma: 0.25
    ema_beta: 0.5
  
  # ------------------------------------------------------------------------------
  # Stage 2: Anchor-Density Map
  # ------------------------------------------------------------------------------
  anchor_density:
    enabled: true
    use_multiscale_density: true
    stage2_k_small: 8
    stage2_k_large: 32
    stage2_k: 128
    use_adaptive_beta: true
    anchor_density_beta: 0.30
    spacing_bias_gamma: 0.8
  
  # ------------------------------------------------------------------------------
  # Stage 3: Importance Sampling
  # ------------------------------------------------------------------------------
  sampling:
    M: 500000
    tau: 0.5
    alpha: 0.20
    use_anchor_density: true
    prob_floor: 1.0e-4
    uniform_mix: 0.15
    plane_snap_beta: 0.5
    topk_pool: 8
    bias_floor: 0.3
    coverage_fraction_max: 0.15
  
  # ------------------------------------------------------------------------------
  # Stage 4: Taubin Smoothing
  # ------------------------------------------------------------------------------
  taubin:
    enabled: true
    iters: 15
    k: 128
    lambda_smooth: 0.70
    lambda_inflate: -0.63
    tangent_only: true
  
  # ------------------------------------------------------------------------------
  # Stage 5: Normal Smoothing
  # ------------------------------------------------------------------------------
  normal_smooth:
    enabled: true
    iters: 12
    k: 128
    lambda_smooth: 0.95
  
  # ------------------------------------------------------------------------------
  # Stage 6: Covariance Construction
  # ------------------------------------------------------------------------------
  covariance:
    sigma0: 0.15 
    voxel_size: 0.75
    kappa_max: 40.0
    k_F: 32
    
    use_F_smoothing: true
    use_polar_decomposition: true
    use_adaptive_scale: true
    
    learnable:
      enabled: true
      alpha: 0.4
      lr: 0.002
      freeze_after_ep: -1
    
    density:
      use_scale_prior: true
      scale_kappa: 0.20
      scale_max_up: 0.25
      scale_smooth_alpha: 4.0
      allow_shrink: false
    
    curvature_cov:
      enabled: true
      aniso_factor: 1.1
      scale_mode: 'adaptive'
      k_neighbors: 128
    
    F_smooth:
      num_nodes: 180
      node_knn: 12
      point_knn: 12
      lambda_lap: 0.05
  
  # ------------------------------------------------------------------------------
  # KNN & Performance
  # ------------------------------------------------------------------------------
  knn:
    use_faiss: true
    use_ivf: true
    tau: 0.20
    nlist: 100
    nprobe: 10
    fallback_chunk_size: 5000
  
  performance:
    use_amp: false
    cache_knn: true
    clear_cache: true
  
  # ------------------------------------------------------------------------------
  # Debug
  # ------------------------------------------------------------------------------
  debug:
    verbose: true
    export_anchor_density: true
    export_anchors: true
    export_dir: "debug/"
    png_dpi: 160
    png_ptsize: 0.5

# ================================================================================
# Rendering
# ================================================================================
camera:
  width: 3840
  height: 2160
  fx: 1425.0
  fy: 1425.0
  cx: 1920.0
  cy: 1080.0
  znear: 0.01
  zfar: 100.0
  
  lookat:
    eye: [25.0, -30.0, 15.0]
    target: [0.0, 0.0, 2.0]
    up: [0.0, 0.0, 1.0]

render:
  num_frames: 1
  schedule: uniform
  bg: [1.0, 1.0, 1.0]
  particle_color: [0.27, 0.51, 0.71]
  
  lighting:
    model: phong
    type: directional
    direction: [0.3, -0.5, 0.8]
    two_sided: true
    ambient: 0.18
    diffuse: 0.85
    specular: 0.10
    shininess: 32

# ================================================================================
# Episode Scheduling
# ================================================================================
episode_schedule:
  1-5:
    upsample:
      sampling:
        M: 500000
        alpha: 0.10
      taubin:
        iters: 15
      normal_smooth:
        iters: 8
    covariance:
      sigma0: 0.20
      density:
        scale_kappa: 0.45
        scale_max_up: 0.60
  
  6-15:
    upsample:
      sampling:
        M: 500000
        alpha: 0.18
      taubin:
        iters: 10
      normal_smooth:
        iters: 6
    covariance:
      sigma0: 0.15
      density:
        scale_kappa: 0.35
        scale_max_up: 0.50
  
  16+:
    upsample:
      sampling:
        alpha: 0.20
      taubin:
        iters: 8
      normal_smooth:
        iters: 5
    covariance:
      sigma0: 0.15
      density:
        scale_kappa: 0.30
