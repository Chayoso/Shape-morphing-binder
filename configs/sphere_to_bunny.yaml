# ================================================================================
# [CVPR 2026] PhysMorph-GS: Physics-guided Gaussian Splatting for Shape Morphing
# ================================================================================

# Input/Output file path
input_mesh_path: "assets/isosphere.obj"
target_mesh_path: "assets/bunny.obj"
output_dir: "output/"

# ===================================================================
# DiffMPM for Shape Morphing setting
# ===================================================================
simulation:
  # Grid setting
  grid_dx: 1                             # Grid cell size
  points_per_cell_cuberoot: 3            # Number of points per cell (cubic root)
  grid_min_point: [-16.0, -16.0, -16.0]  # Grid minimum coordinate
  grid_max_point: [16.0, 16.0, 16.0]     # Grid maximum coordinate
  
  # Material properties (Lame parameters)
  lam: 38888.89                          # λ (Volume elastic modulus)
  mu:  58333.3                           # μ (Shear elastic modulus)
  density: 75.0                          # Density
  
  # Simulation parameters
  dt: 0.00833333333                      # Time step (1/120)
  drag: 0.5                              # Drag coefficient
  external_force: [0.0, 0.0, 0.0]        # External force (gravity, etc.)
  smoothing_factor: 0.955                # Smoothing factor

# ===================================================================
# Optimization setting
# ===================================================================
optimization:
  num_animations: 2                 # Number of animation episodes
  num_timesteps: 10                 # Number of time steps per episode
  control_stride: 1                 # Control frame interval
  max_gd_iters: 1                   # Maximum number of gradient descent iterations
  max_ls_iters: 10                  # Maximum number of line search iterations
  initial_alpha: 0.01               # Initial step size
  gd_tol: 0.0001                    # Gradient tolerance
  
  # HYBRID E2E LOSS CONFIGURATION
  loss:
    enabled: true                   # Enable E2E training
    # Photometric losses
    w_alpha: 0.5
    w_depth: 0.2
    
    #  Silhouette Edge Alignment
    w_edge: 0.1
    
    # Covariance Spectral Alignment
    w_cov_align: 0.3
    
    # Regularization
    w_cov_reg: 0.01
    cov_reg_mode: 'eigenvalue'
    target_cov_scale: 0.02
    w_normal_smooth: 0.0
    
    # Schedule
    schedule: 'constant'

# Output setting
output:
  export_ply: false                 # Export PLY file
  output_format: "ply"              # Output format

# ===================================================================
# 🔥 UPSAMPLING PIPELINE v3.0 (REFACTORED)
# ===================================================================
sampling:
  # ===================================================================
  # DEBUG MODE
  # ===================================================================
  debug:
    verbose: true                   # Print detailed logs
    export_volume_filter: true      # Export PNG after volume filter
    export_dir: "debug/"            # Debug output directory
    png_dpi: 160                    # PNG resolution
    png_ptsize: 0.5                 # Point size in PNG
  
  # ===================================================================
  # STEP 1: SURFACE DETECTION (PCA-based)
  # ===================================================================
  surface_detection:
    enabled: true
    k: 48                           # KNN neighbors for PCA
    soft_tau: 0.30                  # Sigmoid sharpness
    surface_power: 3.0              # Probability concentration
  
  # ===================================================================
  # STEP 2: VOLUME FILTERING (Soft)
  # ===================================================================
  volume_filter:
    enabled: true
    k: 20                           # KNN neighbors for normal consistency
    consistency_threshold: 0.2      # cos(45°) ≈ 0.7
    temperature: 15.0               # Sigmoid sharpness (5=soft, 10=mid, 20=sharp)
    positive_only: True            
    use_distance_weight: False     
    distance_bandwidth: 0.08       
  
  # ===================================================================
  # STEP 3: IMPORTANCE SAMPLING (Gumbel-Softmax)
  # ===================================================================
  sampling:
    M: 100000                       # Target number of samples
    tau: 0.2                        # Gumbel-Softmax temperature
    alpha: 0.20                     # Tangent jitter scale
    thickness: 0.0                  # Normal jitter scale
    density_gamma: 2.5              # Density importance
  
  # ===================================================================
  # STEP 4: TAUBIN SMOOTHING (Differentiable)
  # ===================================================================
  taubin:
    enabled: true
    iters: 5                        # Number of iterations
    k: 32                           # KNN neighbors
    lambda_smooth: 0.7              # Smoothing strength
    lambda_inflate: -0.63           # Inflation strength (negative!)
    tangent_only: true              # Only smooth tangent component
  
  # ===================================================================
  # STEP 5: NORMAL SMOOTHING (Laplacian)
  # ===================================================================
  normal_smooth:
    enabled: true
    iters: 3                        # Number of iterations
    k: 24                           # KNN neighbors
    lambda_smooth: 0.85             # Smoothing strength
  
  # ===================================================================
  # STEP 6: COVARIANCE CONSTRUCTION (F-field)
  # ===================================================================
  covariance:
    sigma0: 0.08                    # Base Gaussian scale
    k_F: 32                         # KNN for F interpolation
    use_F_smoothing: true           # Smooth F field
    use_polar_decomposition: false  # Use polar decomposition
    use_adaptive_scale: false       # Use adaptive scale
    F_smooth:
      num_nodes: 180                # Graph nodes
      node_knn: 8                   # Node neighbors
      point_knn: 8                  # Point-to-node neighbors
      lambda_lap: 0.01              # Laplacian regularization
  
  # ===================================================================
  # KNN SETTINGS
  # ===================================================================
  knn:
    use_faiss: true                 # Use FAISS for speed
    use_ivf: true                   # Use IVF index (10-100x faster)
    tau: 0.15                       # Soft KNN temperature
    nlist: 100                      # Number of IVF clusters
    nprobe: 10                      # Number of clusters to search
    fallback_chunk_size: 5000       # Chunk size for torch fallback
  
  # ===================================================================
  # PERFORMANCE
  # ===================================================================
  performance:
    use_amp: false                  # Mixed precision (false for stability)
    cache_knn: true                 # Cache KNN results
    clear_cache: true               # Clear cache after each call

# ===================================================================
# RENDER SETTINGS (3DGS Runtime Renderer)
# ===================================================================
camera:
  width: 1280
  height: 720
  fx: 475.0                       # Focal length in pixels X
  fy: 475.0                       # Focal length in pixels Y
  cx: 640.0                       # Principal point X
  cy: 360.0                       # Principal point Y
  znear: 0.01
  zfar: 100.0
  lookat:
    eye: [20.0, -25.0, 15.0]      # Camera position
    target: [0.0, 0.0, 0.0]       # Look at origin
    up: [0.0, 0.0, 1.0]           # Up vector (Z-up)

render:
  num_frames: 1                   # Number of frames to render
  schedule: uniform               # Frame scheduling
  bg: [1.0, 1.0, 1.0]             # Background color (white)
  particle_color: [0.27, 0.51, 0.71]  # Particle color (blue)
  
  lighting:
    model: phong                  # Shading model
    type: directional             # Light type
    direction: [0.3, -0.5, 0.8]   # Light direction
    two_sided: true               # Two-sided lighting
    ambient: 0.18                 # Ambient intensity
    diffuse: 0.85                 # Diffuse intensity
    specular: 0.10                # Specular intensity
    shininess: 32                 # Specular shininess

