# Ablation Study 4: Full Model (Ours)
# Physics + All render losses (alpha, depth, edge, covariance)
# This is the complete system - baseline: bunny_1

input_mesh_path: "assets/isosphere.obj"
target_mesh_path: "assets/bunny.obj"
output_dir: "output/ablation/04_full_model/"

simulation:
  grid_dx: 1
  points_per_cell_cuberoot: 3
  grid_min_point: [-16.0, -16.0, -16.0]
  grid_max_point: [16.0, 16.0, 16.0]
  lam: 38888.89
  mu: 58333.3
  density: 75.0
  dt: 0.00833333333
  drag: 0.5
  external_force: [0.0, 0.0, 0.0]
  smoothing_factor: 0.955

optimization:
  num_animations: 20
  num_timesteps: 10
  control_stride: 1
  max_gd_iters: 1
  max_ls_iters: 15
  initial_alpha: 0.01
  gd_tol: 0.0
  use_session_mode: false
  adaptive_alpha_enabled: true

  loss:
    enabled: true
    # ✅ FULL MODEL: All render losses enabled
    w_alpha: 2.0           # Silhouette/opacity alignment
    w_depth: 5.0           # Depth map alignment
    w_photo: 1.0           # Photometric consistency
    w_edge: 3.0            # Edge alignment
    w_cov_align: 10.0      # Covariance spectral alignment
    w_cov_reg: 0.01        # Covariance regularization
    w_det_barrier: 0.1     # det(F) barrier (compression prevention)
    cov_reg_mode: 'eigenvalue'
    schedule: 'constant'

    edge_loss_mode: 'detach_position'
    gradient_boost_factor: 1000.0
    debug_edge_gradients: true

  magnitude_strategy: 'normalize'

upsample:
  use_simple_pipeline: true
  render_loss_weight: 1e2  # Full render loss weight

  covariance:
    use_curvature_for_target: true
    sigma_isotropic: 0.038
    curvature_sigma:
      sigma_n0: 0.064
      sigma_t0: 0.08
      a: 6.0
      b: 5.0
      a_n: 3.5
      u: 2.5
      k_floor_normal: 0.002
      k_floor_tangent: 0.005
    sigma0: 0.08
    k_F: 32
    use_multiscale_F: true
    k_F_coarse: 64
    k_F_fine: 16
    multiscale_blend_mode: 'adaptive'
    enable_subdivision: true
    subdivision_target: 100000
    subdivision_jitter: 0.05
    sv_min: 0.80
    sv_max: 3.00
    use_F_smoothing: false
    F_smooth:
      lambda_lap: 0.005
      num_nodes: 180
      node_knn: 8
      point_knn: 8

camera:
  width: 3840
  height: 2160
  fx: 1425.0
  fy: 1425.0
  cx: 1920.0
  cy: 1080.0
  znear: 0.01
  zfar: 100.0
  lookat:
    eye: [20.0, -25.0, 12.5]
    target: [0.0, 0.0, 0.0]
    up: [0.0, 0.0, 1.0]

render:
  num_frames: 1
  schedule: uniform
  bg: [1.0, 1.0, 1.0]
  training_resolution_scale: 1.0
  particle_color: [0.27, 0.51, 0.71]
  surface_mask_ratio: 0.20
  surface_mask_mode: 'last'
  lighting:
    model: phong
    type: directional
    direction: [0.3, -0.5, 0.8]
    two_sided: true
    ambient: 0.18
    diffuse: 0.85
    specular: 0.10
    shininess: 32
