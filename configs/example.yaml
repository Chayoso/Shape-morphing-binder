# ================================================================================
# 📊 PARAMETER TUNING FLOWCHART
# ================================================================================
#
# START HERE: What's your problem?
#
# 1️⃣ THIN FEATURES DISAPPEARING (bunny ears, fingers)
#    → volume_filter.k: decrease to 16-20
#    → volume_filter.consistency_threshold: decrease to 0.15-0.25
#    → volume_filter.temperature: decrease to 10-12 (sharper)
#    → taubin.lambda_smooth: decrease to 0.4-0.5 (gentler)
#    → Consider: bunny_cfg preset
#
# 2️⃣ SURFACE TOO NOISY (jagged, bumpy)
#    → taubin.iters: increase to 5-7
#    → taubin.k: increase to 32-40
#    → normal_smooth.lambda_smooth: increase to 0.85-0.95
#    → surface_detection.k: increase to 56-64
#
# 3️⃣ SURFACE TOO SMOOTH (lost detail)
#    → taubin.lambda_smooth: decrease to 0.4-0.5
#    → taubin.iters: decrease to 2-3
#    → normal_smooth.lambda_smooth: decrease to 0.6-0.7
#    → surface_detection.k: decrease to 32-40
#
# 4️⃣ HOLES OR GAPS IN SURFACE
#    → sampling.M: increase (more samples)
#    → sampling.alpha: increase to 0.30-0.40 (wider jitter)
#    → surface_detection.surface_power: decrease to 2.0-3.0
#    → Check: volume_filter may be too strict
#
# 5️⃣ INTERIOR POINTS VISIBLE (volume artifacts)
#    → volume_filter.enabled: ensure true!
#    → volume_filter.consistency_threshold: increase to 0.4-0.6
#    → volume_filter.k: increase to 28-32
#    → volume_filter.positive_only: ensure true!
#
# 6️⃣ TOO SLOW (need faster preview)
#    → sampling.M: decrease to 30k-50k
#    → Use fast_cfg preset
#    → volume_filter.enabled: false (if acceptable)
#    → taubin.enabled: false (if acceptable)
#
# 7️⃣ SIMULATION UNSTABLE (explodes, NaN)
#    → simulation.dt: decrease by half (0.0083 → 0.0042)
#    → simulation.drag: increase to 0.7-0.9
#    → Check: grid bounds contain mesh
#    → Check: lambda_inflate is NEGATIVE
#
# 8️⃣ SHAPE DOESN'T MORPH (stuck at initial)
#    → optimization.loss.w_cov_align: increase to 0.5-0.7
#    → optimization.loss.w_alpha: increase to 0.7-0.9
#    → optimization.num_timesteps: increase to 15-20
#    → Check: target mesh is reasonable
#
# 9️⃣ RENDERING LOOKS WRONG
#    → Check camera.lookat (is mesh visible?)
#    → covariance.sigma0: adjust to mesh scale
#    → render.lighting.ambient: increase if too dark
#    → Check: mesh scale (normalize to [-1,1] recommended)
#
# 🔟 OUT OF MEMORY (OOM)
#    → sampling.M: decrease (primary memory consumer)
#    → knn.use_ivf: ensure true (uses less memory)
#    → sampling.sampling.M: try 50k or 30k
#    → Clear GPU cache between runs
#
# ================================================================================