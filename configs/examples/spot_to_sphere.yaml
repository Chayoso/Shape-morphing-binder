# PhysMorph-GS: Clean Config (v2.3.2)
# All unused parameters removed

# ════════════════════════════════════════════════════════════════════════════════
# I/O
# ════════════════════════════════════════════════════════════════════════════════
input_mesh_path: "assets/spot.obj"
target_mesh_path: "assets/isosphere.obj"
output_dir: "output/spot/sphere"

# ════════════════════════════════════════════════════════════════════════════════
# Physics Simulation (MPM)
# ════════════════════════════════════════════════════════════════════════════════
simulation:
  grid_dx: 1
  points_per_cell_cuberoot: 3  # 🔥 INCREASED: 2→3 for better surface coverage (3.375x more particles)
  grid_max_point: [16.0, 16.0, 16.0]
  lam: 38888.89
  mu: 58333.3
  density: 75.0
  dt: 0.00833333333
  drag: 0.5
  external_force: [0.0, 0.0, 0.0]
  smoothing_factor: 0.955

# ════════════════════════════════════════════════════════════════════════════════
# Optimization
# ════════════════════════════════════════════════════════════════════════════════
optimization:
  num_animations: 40  # 🔥 Extended training with learning rate decay
  num_timesteps: 10
  control_stride: 1
  max_gd_iters: 1
  max_ls_iters: 10
  initial_alpha: 0.01  # 🔥 CONSERVATIVE: Small step size to prevent cumulative deformation instability
  gd_tol: 0.0001

  # E2E Loss
  loss:
    enabled: true  # 🔥 ENABLED: Testing render loss with gradient fix
    # 🔥 Global render loss weight (balances render vs physics loss magnitude)
    # Physics loss ~4000-5000, Render loss ~1700 × 200 = 340,000 (68x physics)
    # REDUCED: 1000 → 200 to give physics more influence and prevent render loss dominating
    render_loss_weight: 200.0  # Reduced for balanced physics-render optimization

    # Individual component weights (relative importance within render loss)
    w_alpha: 0.5
    w_depth: 1.0               # 🔥 INCREASED: 0.2 → 1.0 (5x) to make depth loss more influential
    w_photo: 0.1
    w_edge: 0.1
    w_cov_align: 0.3
    w_cov_reg: 0.01
    w_det_barrier: 0.1         # det(F) barrier 
    cov_reg_mode: 'eigenvalue'
    schedule: 'constant'

  # 🔥 NEW: Normalized gradient combination (prevents magnitude mismatch)
  # Magnitude strategy: 'physics' (conservative), 'weighted' (balanced), 'max' (aggressive)
  magnitude_strategy: 'physics'

# ════════════════════════════════════════════════════════════════════════════════
# Upsampling Pipeline (Simple Mode)
# ════════════════════════════════════════════════════════════════════════════════
upsample:
  # 🔥 Simple pipeline mode
  use_simple_pipeline: true  # Direct F → Covariance (no upsampling)
  
  # Covariance settings
  covariance:
    # 🔥 Target mesh covariance mode
    use_curvature_for_target: true  # true = curvature-based | false = isotropic

    # Target mesh (isotropic mode)
    sigma_isotropic: 0.038          # σ² * I when use_curvature_for_target=false

    # Target mesh (curvature mode)
    curvature_sigma:
      # 🔥 MODIFIED: Reduce base scales to amplify curvature effect
      sigma_n0: 0.02              # Normal direction scale (was 0.008)
      sigma_t0: 0.03              # Tangent direction scale (was 0.015)

      # 🔥 MODIFIED: Increase multipliers for stronger curvature modulation
      a: 12.0                       # Mean curvature multiplier (was 2.0) - AMPLIFY!
      b: 5.0                       # Aniso curvature multiplier (was 0.5) - AMPLIFY!

      a_n: 3                     # Normal decay coeff (was 0.5)
      u: 3                       # Normal decay exponent (keep)
      k_floor_normal: 0.002         # Normal floor
      k_floor_tangent: 0.005        # Tangent floor

    # Morph (F-based deformation)
    sigma0: 0.25                   # 🔥 INCREASED: 0.10→0.25 for better coverage (2.5x larger Gaussians to fill gaps!)
    k_F: 32                        # KNN for F interpolation (single-scale mode)

    # 🔥 NEW: Multi-scale F-field interpolation (for large deformations)
    use_multiscale_F: true         # Enable multi-scale interpolation (coarse + fine)
    k_F_coarse: 64                 # Coarse scale KNN (global deformation, sphere → bunny outline)
    k_F_fine: 16                   # Fine scale KNN (local details, bunny ears/nose/tail)
    multiscale_blend_mode: 'adaptive'  # 'adaptive' = det(F)-based blending | 'fixed' = 50/50

    # 🔥 NEW: Subdivision-based upsampling (for gap filling)
    enable_subdivision: true        # Enable upsampling (37k → 60k particles)
    subdivision_target: 60000      # Target particle count after upsampling
    subdivision_jitter: 0.15       # Jitter scale for child particles (relative to local spacing)

    # 🔥 ADJUSTED: Allow more deformation range for better surface detail
    # With more particles (27 vs 8), we can afford slightly more compression
    sv_min: 0.80                   # INCREASED flexibility: 0.85→0.80 (20% compression per episode)
    sv_max: 1.20                   # INCREASED flexibility: 1.15→1.20 (20% expansion per episode)

    # 🔥 F-field smoothing control (preserves sharp features like bunny ears)
    use_F_smoothing: false         # DISABLED: Avoid gradient mismatch during E2E training
    F_smooth:
      lambda_lap: 0.005            # Regularization strength (default: 0.01)
                                   # REDUCED 50% to preserve sharp deformations
      num_nodes: 180               # Graph size (default)
      node_knn: 8                  # Node connectivity (default)
      point_knn: 8                 # Interpolation neighbors (default)

# ════════════════════════════════════════════════════════════════════════════════
# Rendering
# ════════════════════════════════════════════════════════════════════════════════
camera:
  width: 3840
  height: 2160
  fx: 1425.0
  fy: 1425.0
  cx: 1920.0
  cy: 1080.0
  znear: 0.01
  zfar: 100.0
  lookat:
    eye: [20.0, -25.0, 12.5]
    target: [0.0, 0.0, 0.0]
    up: [0.0, 0.0, 1.0]

render:
  num_frames: 1
  schedule: uniform
  bg: [1.0, 1.0, 1.0]
  # 🚀 OPTIMIZATION: Reduce resolution during training (0.5 = 4K→1080p, 4x speedup)
  training_resolution_scale: 0.5  # Set to 1.0 to disable, 0.5 for 2x downscale, 0.25 for 4x downscale
  particle_color: [0.27, 0.51, 0.71]
  lighting:
    model: phong
    type: directional
    direction: [0.3, -0.5, 0.8]
    two_sided: true
    ambient: 0.18
    diffuse: 0.85
    specular: 0.10
    shininess: 32

# ════════════════════════════════════════════════════════════════════════════════
# Episode Schedule (Gradual Learning Rate Decay for 25 Episodes)
# ════════════════════════════════════════════════════════════════════════════════
episode_schedule:
  # Episodes 0-7: Base learning rate (0.01)
  # Fast initial convergence phase

  # Episodes 8-15: First decay - reduce by 50%
  8-15:
    optimization:
      initial_alpha: 0.005  # 50% of base (0.01 → 0.005)

  # Episodes 16-23: Second decay - reduce by 75%
  16-23:
    optimization:
      initial_alpha: 0.0025  # 25% of base (0.01 → 0.0025)

  # Episodes 24+: Final decay - reduce by 87.5% for fine-tuning
  24+:
    optimization:
      initial_alpha: 0.00125  # 12.5% of base (0.01 → 0.00125)

