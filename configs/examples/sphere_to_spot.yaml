# PhysMorph-GS: Clean Config (v2.3.2)
# All unused parameters removed

# ════════════════════════════════════════════════════════════════════════════════
# I/O
# ════════════════════════════════════════════════════════════════════════════════
input_mesh_path: "assets/isosphere.obj"
target_mesh_path: "assets/spot.obj"
output_dir: "output/sphere/spot/"

# ════════════════════════════════════════════════════════════════════════════════
# Physics Simulation (MPM)
# ════════════════════════════════════════════════════════════════════════════════
simulation:
  grid_dx: 1
  points_per_cell_cuberoot: 3  # 🔥 INCREASED: 2→3 for better surface coverage (3.375x more particles)
  grid_min_point: [-16.0, -16.0, -16.0]
  grid_max_point: [16.0, 16.0, 16.0]
  lam: 38888.89
  mu: 58333.3
  density: 75.0
  dt: 0.00833333333
  drag: 0.5
  external_force: [0.0, 0.0, 0.0]
  smoothing_factor: 0.955

# ════════════════════════════════════════════════════════════════════════════════
# Optimization
# ════════════════════════════════════════════════════════════════════════════════
optimization:
  num_animations: 40  # 🔥 INCREASED: 25→40 for better convergence (physics loss 350→100)
  num_timesteps: 10
  control_stride: 1
  max_gd_iters: 10    # 🔥 INCREASED: 10→15 for tighter convergence
  max_ls_iters: 15     # 🔥 INCREASED: 10→15 for better line search
  initial_alpha: 0.005  # 🔥 CONSERVATIVE: Small step size to prevent cumulative deformation instability
  gd_tol: 0.00005      # 🔥 TIGHTER: 0.0001→0.00005 (2x tighter tolerance)
  use_session_mode: false
  

  # E2E Loss
  loss:
    enabled: true  # 🔥 ENABLED: Testing render loss with gradient fix
    # 🔥 Global render loss weight (balances render vs physics loss magnitude)
    # INCREASED: 200 → 500 → 1000 → 5000 to make render DOMINATE physics!
    # Higher weight = render quality affects physics optimization more strongly
    render_loss_weight: 1e4  # AGGRESSIVE: Render must dominate!

    # Individual component weights (relative importance within render loss)
    # 🔥 AGGRESSIVE BOOST: Make render components DOMINATE physics guidance!
    w_alpha: 2.0               # INCREASED: 0.5 → 1.0 → 2.0 (opacity critical!)
    w_depth: 5.0               # INCREASED: 1.0 → 2.0 → 5.0 (depth = shape accuracy!)
    w_photo: 1.0               # INCREASED: 0.1 → 0.5 → 1.0 (appearance matters!)
    w_edge: 3.0                # INCREASED: 0.1 → 1.0 → 3.0 (CRITICAL for boundaries!)
    w_cov_align: 10.0          # INCREASED: 5.0 → 8.0 → 10.0 (maximum F-gradient signal!)
    w_cov_reg: 0.01
    w_det_barrier: 0.1         # det(F) barrier 
    cov_reg_mode: 'eigenvalue'
    schedule: 'constant'

  # 🔥 NEW: Normalized gradient combination (prevents magnitude mismatch)
  # Magnitude strategy: 'physics' (conservative), 'weighted' (balanced), 'max' (aggressive), 'normalize' (RMS - truly balanced!)
  magnitude_strategy: 'normalize'  # BEST: RMS normalization - treats both losses equally!

# ════════════════════════════════════════════════════════════════════════════════
# Upsampling Pipeline (Simple Mode)
# ════════════════════════════════════════════════════════════════════════════════
upsample:
  # 🔥 Simple pipeline mode
  use_simple_pipeline: true  # Direct F → Covariance (no upsampling)

  # 🔥 E2E Render Loss Weight (read by rs_full in training_loop.py)
  render_loss_weight: 1e5  # AGGRESSIVE: Render must dominate!
  w_alpha: 2.0
  w_depth: 5.0
  w_photo: 1.0
  w_edge: 3.0
  w_cov_align: 10.0
  w_cov_reg: 0.01
  w_det_barrier: 0.1
  magnitude_strategy: 'normalize'  # RMS normalization

  # Covariance settings
  covariance:
    # 🔥 Target mesh covariance mode
    use_curvature_for_target: true  # true = curvature-based | false = isotropic

    # Target mesh (isotropic mode)
    sigma_isotropic: 0.038          # σ² * I when use_curvature_for_target=false

    # Target mesh (curvature mode)
    curvature_sigma:
      # 🔥 MODIFIED: Reduce base scales to amplify curvature effect
      sigma_n0: 0.02              # Normal direction scale (was 0.008)
      sigma_t0: 0.03              # Tangent direction scale (was 0.015)

      # 🔥 MODIFIED: Increase multipliers for stronger curvature modulation
      a: 12.0                       # Mean curvature multiplier (was 2.0) - AMPLIFY!
      b: 5.0                       # Aniso curvature multiplier (was 0.5) - AMPLIFY!

      a_n: 3                     # Normal decay coeff (was 0.5)
      u: 3                       # Normal decay exponent (keep)
      k_floor_normal: 0.002         # Normal floor
      k_floor_tangent: 0.005        # Tangent floor

    # Morph (F-based deformation)
    sigma0: 0.25                   # 🔥 BALANCED: Resolution fixed, can use smaller Gaussians for sharpness
    k_F: 32                        # KNN for F interpolation (single-scale mode)

    # 🔥 NEW: Multi-scale F-field interpolation (for large deformations)
    use_multiscale_F: true         # Enable multi-scale interpolation (coarse + fine)
    k_F_coarse: 64                 # Coarse scale KNN (global deformation, sphere → bunny outline)
    k_F_fine: 16                   # Fine scale KNN (local details, bunny ears/nose/tail)
    multiscale_blend_mode: 'adaptive'  # 'adaptive' = det(F)-based blending | 'fixed' = 50/50

    # 🔥 NEW: Subdivision-based upsampling (for gap filling)
    enable_subdivision: true        # Enable upsampling (37k → 100k particles)
    subdivision_target: 60000     # Target particle count after upsampling (good balance for 4K)
    subdivision_jitter: 0.08       # Jitter scale for child particles (slight randomness for natural look)

    # 🔥 ADJUSTED: Allow more deformation range for better surface detail
    # With more particles (27 vs 8), we can afford slightly more compression
    sv_min: 0.80                   # INCREASED flexibility: 0.85→0.80 (20% compression per episode)
    sv_max: 1.20                   # INCREASED flexibility: 1.15→1.20 (20% expansion per episode)

    # 🔥 F-field smoothing control (preserves sharp features like bunny ears)
    use_F_smoothing: true          # ENABLED: Smooth F-field to reduce bumpy surface
    F_smooth:
      lambda_lap: 0.005            # Regularization strength (default: 0.01)
                                   # REDUCED 50% to preserve sharp deformations
      num_nodes: 180               # Graph size (default)
      node_knn: 8                  # Node connectivity (default)
      point_knn: 8                 # Interpolation neighbors (default)

# ════════════════════════════════════════════════════════════════════════════════
# Rendering
# ════════════════════════════════════════════════════════════════════════════════
camera:
  width: 3840
  height: 2160
  fx: 1425.0
  fy: 1425.0
  cx: 1920.0
  cy: 1080.0
  znear: 0.01
  zfar: 100.0
  lookat:
    eye: [20.0, -25.0, 12.5]
    target: [0.0, 0.0, 0.0]
    up: [0.0, 0.0, 1.0]

render:
  num_frames: 1
  schedule: uniform
  bg: [1.0, 1.0, 1.0]
  # 🚀 OPTIMIZATION: Reduce resolution during training (0.5 = 4K→1080p, 4x speedup)
  training_resolution_scale: 1.0  # FULL 4K resolution (3840x2160) - no blur!
  particle_color: [0.27, 0.51, 0.71]
  lighting:
    model: phong
    type: directional
    direction: [0.3, -0.5, 0.8]
    two_sided: true
    ambient: 0.18
    diffuse: 0.85
    specular: 0.10
    shininess: 32

# ════════════════════════════════════════════════════════════════════════════════
# Episode Schedule (Gradual Learning Rate Decay for 40 Episodes)
# ════════════════════════════════════════════════════════════════════════════════
episode_schedule:
  # Episodes 0-7: Base learning rate (0.005)
  # Fast initial convergence phase

  # Episodes 8-15: First decay - reduce by 50%
  8-15:
    optimization:
      initial_alpha: 0.0025  # 50% of base (0.005 → 0.0025)

  # Episodes 16-23: Second decay - reduce by 75%
  16-23:
    optimization:
      initial_alpha: 0.00125  # 25% of base (0.005 → 0.00125)

  # Episodes 24-31: Third decay - fine tuning
  24-31:
    optimization:
      initial_alpha: 0.000625  # 12.5% of base (0.005 → 0.000625)

  # Episodes 32+: Final decay - ultra-fine tuning to reach physics loss ~100
  32+:
    optimization:
      initial_alpha: 0.0003  # Very small steps for final convergence

