# Visualization shortlist for asymmetry-focused experiments
#
# Suggested run after `configs/bunny_asymmetry.yaml` finishes:
#   python run.py -c configs/bunny_asymmetry_viz.yaml --png --skip-existing

output_base: "output/bunny_asymmetry_viz"

defaults:
  input_mesh_path: "assets/isosphere.obj"
  simulation:
    grid_dx: 1.0
    grid_min_point: [-16.0, -16.0, -16.0]
    grid_max_point: [16.0, 16.0, 16.0]
    points_per_cell_cuberoot: 5
    lam: 38888.89
    mu: 58333.3
    density: 75.0
    dt: 0.00833333333
    drag: 0.5
    external_force: [0.0, 0.0, 0.0]
    smoothing_factor: 0.955
  optimization:
    num_animations: 30
    num_timesteps: 10
    control_stride: 1
    max_gd_iters: 1
    max_ls_iters: 10
    initial_alpha: 0.01
    final_alpha: 0.001
    gd_tol: 0.0001
  plasticity:
    eta: 0.0
    adaptive_eta_max: 5.0
    eta_v: 0.0
    max_v: 5.0
    max_anisotropy: 1.5
    smooth_k: 64
    clip_pct: 95.0
    diffusion_iters: 3
    damping: 0.0
    cohesion_k: 32
    cohesion_strength: 0.0
    cohesion_sparse_threshold: 1.5
    lambda_render: 0.0
  correction:
    enabled: true
    grid_res: 8
    lr: 0.01
    num_iters: 6
    every_n_eps: 2
    w_smooth: 0.1
    max_disp: 1.0
    mass_gate_tau: 0.1
    reset_kinematics_on_accept: true
    absorb_fp_on_accept: true
    skip_dfp_update_on_accept: true
  multi_view:
    enabled: true
    preset: ring
    num_cameras: 8
  loss_weights:
    w_bce: 1.0
    w_iou: 1.0
    w_dt: 0.0
    mv_hardmax_w: 0.0
    mv_topk_w: 0.0
    mv_topk_k: 0
    masked_threshold: 0.01
  render:
    sigma0: auto
    sigma0_scale: 0.5
    opacity: 0.95
    bg: [1.0, 1.0, 1.0]
    training_resolution_scale: 0.5
    particle_color: [0.27, 0.51, 0.71]
    lighting:
      model: phong
      type: directional
      direction: [0.3, -0.5, 0.8]
      two_sided: true
      ambient: 0.18
      diffuse: 0.85
      specular: 0.10
      shininess: 32
  upsample:
    covariance:
      sigma0: 0.08
  camera:
    width: 1920
    height: 1080
    fx: 712.5
    fy: 712.5
    cx: 960.0
    cy: 540.0
    znear: 0.01
    zfar: 100.0
    lookat:
      eye: [20.0, -25.0, 12.5]
      target: [0.0, 0.0, 0.0]
      up: [0.0, 0.0, 1.0]

experiments:
  - name: bunny_asym_ref_stronger_viz
    target_mesh_path: "assets/bunny.obj"

  - name: bunny_asym_hmax10_viz
    target_mesh_path: "assets/bunny.obj"
    loss_weights:
      mv_hardmax_w: 1.0

  - name: bunny_asym_hmax05_topk2_05_viz
    target_mesh_path: "assets/bunny.obj"
    loss_weights:
      mv_hardmax_w: 0.5
      mv_topk_w: 0.5
      mv_topk_k: 2

  - name: bunny_asym_ringtop_topw2_hmax10_viz
    target_mesh_path: "assets/bunny.obj"
    multi_view:
      enabled: true
      preset: ring_top
      num_cameras: 8
      top_elev: 85.0
      top_view_weight: 2.0
    loss_weights:
      mv_hardmax_w: 1.0
