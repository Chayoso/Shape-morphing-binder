# ════════════════════════════════════════════════════════════════════════════════
# [CVPR 2026] PhysMorph-GS: Physics-guided Gaussian Splatting for Shape Morphing
# ════════════════════════════════════════════════════════════════════════════════
# 
# Configuration File - Sphere to Bob Morphing
#
#
# ════════════════════════════════════════════════════════════════════════════════

# ════════════════════════════════════════════════════════════════════════════════
# I/O CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════
input_mesh_path: "assets/isosphere.obj"      # start mesh (sphere)
target_mesh_path: "assets/bob.obj"         # target mesh (bunny)
output_dir: "output/"                        # output directory

output:
  export_ply: false                          # export PLY file
  output_format: "ply"                       # output format (ply/obj)

# ════════════════════════════════════════════════════════════════════════════════
# PHYSICS SIMULATION (Material Point Method)
# ════════════════════════════════════════════════════════════════════════════════
# 
# MPM (Material Point Method) simulation
# - Particles: Lagrangian particles (mass, position, velocity, deformation gradient F)
# - Grid: Eulerian grid (momentum transfer, collision handling)
# - Deformation gradient F is used for subsequent Gaussian covariance calculation
#
# ════════════════════════════════════════════════════════════════════════════════
simulation:
  
  # ──────────────────────────────────────────────────────────────────────────────
  # Grid Configuration
  # ──────────────────────────────────────────────────────────────────────────────
  # Higher grid resolution:
  #   ✅ More accurate simulation
  #   ✅ Smoother deformation
  #   ❌ Memory/time increase
  #
  grid_dx: 0.75                              # Grid cell size (smaller = higher resolution)
                                             # 0.5 = high quality, 0.75 = balanced, 1.0 = fast
  
  points_per_cell_cuberoot: 3                # Number of particles per cell (cubic root)
                                             # 3 → 3³ = 27 particles per cell
                                             # 4 → 4³ = 64 particles per cell
  
  grid_min_point: [-16.0, -16.0, -16.0]      # Grid minimum coordinate
  grid_max_point: [16.0, 16.0, 16.0]         # Grid maximum coordinate
                                             # Size = (max-min)/dx = 32/0.75 ≈ 43 cells per axis
  
  # ──────────────────────────────────────────────────────────────────────────────
  # Material Properties (Hyperelastic Model)
  # ──────────────────────────────────────────────────────────────────────────────
  # Lamé parameters (Lame parameters):
  #   λ (lam): Bulk modulus (volume elastic modulus) - compression/expansion resistance
  #   μ (mu):  Shear modulus (shear elastic modulus) - deformation/torsion resistance
  #
  # Higher → harder (deformation resistance)
  # Lower → softer (deformation ease)
  #
  lam: 38888.89                              # λ: Volume preservation
  mu: 58333.3                                # μ: Shape preservation (1.5×λ for rubber-like)
  density: 75.0                              # Density (mass/volume)
  
  # ──────────────────────────────────────────────────────────────────────────────
  # Simulation Parameters
  # ──────────────────────────────────────────────────────────────────────────────
  dt: 0.00833333333                          # Time step (1/120 sec = 120 FPS)
                                             # Smaller → stable, larger → faster but unstable
  
  drag: 0.5                                  # Drag coefficient (air resistance)
                                             # 0.0 = no resistance, 1.0 = maximum resistance
                                             # Higher → slower movement, smoother
  
  external_force: [0.0, 0.0, 0.0]            # External force (gravity, etc.)
                                             # [0, 0, -9.8] = gravity downward
  
  smoothing_factor: 0.955                    # Velocity smoothing (0.0-1.0)
                                             # v_new = α·v_old + (1-α)·acceleration
                                             # Higher → smoother acceleration/deceleration

# ════════════════════════════════════════════════════════════════════════════════
# OPTIMIZATION SETTINGS
# ════════════════════════════════════════════════════════════════════════════════
#
# End-to-End Training Loop:
#   For each episode:
#     For each pass (3 passes):
#       1. Inject render gradients (∂L_render/∂F, ∂L_render/∂x)
#       2. Physics optimization (Adam on control forces)
#       3. Compute new render gradients
#       4. Store for next pass
#
# ════════════════════════════════════════════════════════════════════════════════
optimization:
  
  # ──────────────────────────────────────────────────────────────────────────────
  # Training Schedule
  # ──────────────────────────────────────────────────────────────────────────────
  num_animations: 50                         # Total number of episodes (training iterations)
  num_timesteps: 10                          # Number of timesteps per episode
                                             # More → smoother deformation, slower convergence
                                             # Less → faster convergence, more abrupt deformation
  
  control_stride: 1                          # Control frame interval (usually 1)
  
  # ──────────────────────────────────────────────────────────────────────────────
  # Gradient Descent Parameters
  # ──────────────────────────────────────────────────────────────────────────────
  max_gd_iters: 1                            # GD iteration per timestep
  max_ls_iters: 10                           # Line search iterations
  initial_alpha: 0.005                       # Learning rate (step size)
                                             # Smaller → stable, slower
                                             # Larger → faster, more unstable
  
  gd_tol: 0.0001                             # Gradient tolerance (convergence condition)
  
  # ──────────────────────────────────────────────────────────────────────────────
  # End-to-End Rendering Loss
  # ──────────────────────────────────────────────────────────────────────────────
  # Backpropagate rendering loss to physics for joint optimization
  #
  # L_total = L_physics + λ·L_render
  # L_render = w_α·L_α + w_edge·L_edge + w_cov·L_cov_align + w_reg·L_cov_reg
  #
  loss:
    enabled: true                            # Enable E2E training
    
    # ┌─────────────────────────────────────────────────────────────────────────┐
    # │ Photometric Losses (image-based losses)                                       │
    # └─────────────────────────────────────────────────────────────────────────┘
    w_alpha: 1500                            # Silhouette loss (silhouette alignment)
                                            # Alpha channel comparison (foreground/background separation)
                                             # Higher → higher silhouette accuracy
    
    w_depth: 0.1                             # Depth loss (depth alignment)
                                             # Usually set small (auxiliary role)
    
    # ┌─────────────────────────────────────────────────────────────────────────┐
    # │ Geometric Losses (geometric-based losses)                                         │
    # └─────────────────────────────────────────────────────────────────────────┘
    w_edge: 500                              # Edge alignment (edge alignment)
                                             # 2D projected Gaussian edges vs. target silhouette edges
    
    w_cov_align: 5000                        # Covariance alignment (covariance alignment)
                                             # Predicted Σ vs. Target Σ (from curvature)
                                             # Gaussian shape/size mapping
    
    # ┌─────────────────────────────────────────────────────────────────────────┐
    # │ Regularization (regularization)                                                   │
    # └─────────────────────────────────────────────────────────────────────────┘
    w_cov_reg: 0.01                          # Covariance regularization
                                             # Avoid too large or small Gaussians
    
    cov_reg_mode: 'eigenvalue'               # Regularization mode
                                             # 'eigenvalue' = eigenvalue-based
                                             # 'frobenius' = Frobenius norm
    
    target_cov_scale: 0.02                   # Target Gaussian size
    
    w_normal_smooth: 0.0                     # Normal smoothness (usually 0)
    
    schedule: 'constant'                     # Loss weight scheduling
                                             # 'constant' = fixed
                                             # 'linear' = linear increase
                                             # 'cosine' = cosine annealing

# ════════════════════════════════════════════════════════════════════════════════
# UPSAMPLING PIPELINE
# ════════════════════════════════════════════════════════════════════════════════
#
# 6-Stage Differentiable Pipeline:
#   Input:  Sparse particles (N ~ 2k-10k) with deformation gradients F
#   Output: Dense Gaussians (M ~ 400k) with covariances Σ
#
#   Stage 1: Surface Detection    → Surface point identification (PCA)
#   Stage 2: Density Map           → Local density calculation
#   Stage 3: Point Generation      → Gumbel-Softmax sampling + jittering
#   Stage 4: Taubin Smoothing      → Position smoothing (preserve volume)
#   Stage 5: Normal Smoothing      → Normal vector smoothing
#   Stage 6: Covariance            → Anisotropic Gaussian generation (F-field based)
#
# All stages are differentiable, supporting end-to-end gradient flow
#
# ════════════════════════════════════════════════════════════════════════════════
upsample:
  
  # ────────────────────────────────────────────────────────────────────────────
  # Common Settings
  # ────────────────────────────────────────────────────────────────────────────
  k_neighbors: 128                            # Default KNN neighbors
                                             # PCA, smoothing, etc.
                                             # More → smoother, slower
  
  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 1: SURFACE DETECTION
  # ════════════════════════════════════════════════════════════════════════════
  #
  # Objective: Identify surface points among sparse particles
  # Method: PCA (Principal Component Analysis)
  #   - Planarity: λ₀/(λ₀+λ₁+λ₂) → smaller = more planar (surface points)
  #   - Select top N% for sampling probability calculation
  #
  # ════════════════════════════════════════════════════════════════════════════
  surface_detection:
    enabled: true                            # Enable (recommended: true)
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ PCA Neighborhood                                                       │
    # └────────────────────────────────────────────────────────────────────────┘
    k: 128                                    # Number of neighbors for PCA calculation
                                             # More → smoother normal, slower
                                             # Recommended: 48-96 (noisy mesh is higher)
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ Surface Selection                                                      │
    # └────────────────────────────────────────────────────────────────────────┘
    planarity_percentile: 20.0               # Consider top N% points as surface
                                             # Smaller → stricter selection
                                             # Larger → more lenient selection
                                             # Recommended: 10-30%
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ Score Distribution (probability distribution control)                  │
    # └────────────────────────────────────────────────────────────────────────┘
    soft_tau: 0.50                           # Sigmoid sharpness (smaller = sharper)
    surface_power: 6.0                       # Probability concentration (larger = more difference)
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ Advanced Settings                                                      │
    # └────────────────────────────────────────────────────────────────────────┘
    use_spacing_score: false                 # Use spacing score (usually false)
    spacing_weight: 0.0                      # Planarity vs Spacing weight
    surface_n_sigma: 0.25                    # Absolute threshold: μ-k·σ
    ema_beta: 0.5                            # EMA smoothing (temporal stability)
  
  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 2: DENSITY MAP 
  # ════════════════════════════════════════════════════════════════════════════
  #
  # Objective: Calculate local density around each anchor
  # Purpose: Sparse area detection → Adaptive adjustment of Gaussian size
  #
  # ════════════════════════════════════════════════════════════════════════════
  anchor_density:
    enabled: true
    
    # Multi-scale density 
    use_multiscale_density: true             # Calculate density on multiple scales
    stage2_k_small: 8                        # Small scale neighbors (local detail)
    stage2_k_large: 32                       # Large scale neighbors (global structure)
    stage2_k: 128                             # Legacy fallback
    
    # Density bias
    use_adaptive_beta: true                  # Adaptive beta calculation
    anchor_density_beta: 0.30                # Bias strength (lower = uniform sampling)
    spacing_bias_gamma: 0.6                  # Spacing bias exponent
  
  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 3: POINT GENERATION
  # ════════════════════════════════════════════════════════════════════════════
  #
  # Objective: N anchors → M dense points (M >> N)
  # Method: Gumbel-Softmax (differentiable categorical sampling)
  #   1. Importance sampling: Select anchor based on probability p
  #   2. Tangent jitter: Random movement along the surface
  #   3. Plane snap: Project to tangent plane
  #
  # ════════════════════════════════════════════════════════════════════════════
  sampling:
    M: 500000                                # Number of points to generate (override num_points)
                                             # More → smoother, memory↑
                                             # Recommended: 300k-500k
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ Gumbel-Softmax Sampling                                                │
    # └────────────────────────────────────────────────────────────────────────┘
    tau: 0.5                                 # Gumbel temperature
                                             # Smaller → deterministic (closer to top-k)
                                             # Larger → uniform (all points uniform)
                                             # Recommended: 0.1-0.5
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ Surface Jittering                                                      │
    # └────────────────────────────────────────────────────────────────────────┘
    alpha: 0.30                              # Tangent jitter strength
                                             # p_new = p_anchor + α·h·(U·t₁ + V·t₂)
                                             # Smaller → closer to anchor (smoother)
                                             # Larger → more spread (coverage↑, noise↑)
                                             # Recommended: 0.1-0.3
                                             # 🔥 0.45 too large! 0.30 for uniform distribution
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ Probability Adjustment                                                 │
    # └────────────────────────────────────────────────────────────────────────┘
    use_anchor_density: true                 # Use density map
    prob_floor: 1.0e-4                       # Minimum probability (all anchors reachable)
    uniform_mix: 0.15                        # Uniform mixing ratio (15%)
                                             # Higher → more uniform sampling
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ Geometric Constraints                                                  │
    # └────────────────────────────────────────────────────────────────────────┘
    plane_snap_beta: 0.5                     # Tangent plane snap strength (0-1)
    topk_pool: 8                             # Top-k candidate pool
    bias_floor: 0.3                          # Bias floor (avoid exclusion)
    coverage_fraction_max: 0.15              # Coverage fraction
  
  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 4: TAUBIN SMOOTHING
  # ════════════════════════════════════════════════════════════════════════════
  #
  # Objective: Smooth point positions while preserving volume without shrinkage
  # Method: Taubin's λ-μ algorithm
  #   Pass 1: p' = p + λ·L·p      (smoothing, shrinkage occurs)
  #   Pass 2: p" = p' + μ·L·p'    (inflation, shrinkage correction)
  #   Here μ < 0 (negative!)
  #
  # ════════════════════════════════════════════════════════════════════════════
  taubin:
    enabled: true                            # Enable (recommended: true)
    
    iters: 15                                # Number of smoothing iterations
                                             # More → smoother, slower
                                             # Recommended: 8-15 (noisy input is higher)
                                             # 🔥 12 → 15 for maximum smoothing
    
    k: 128                                    # Number of neighbors for Laplacian calculation
                                             # More → smoother, slower
                                             # Recommended: 24-48
    
    lambda_smooth: 0.70                      # Smoothing strength (positive, 0-1)
                                             # Larger → stronger smoothing
                                             # Recommended: 0.6-0.9
    
    lambda_inflate: -0.63                     # Inflation strength (negative!)
                                             # Larger → stronger inflation (shrinkage correction)
                                             # Recommended: -0.3 ~ -0.6
                                             # Balance: |μ|/λ ≈ 0.5-0.7
    
    tangent_only: true                       # Only smooth tangent direction
                                             # true = keep surface, false = smooth all directions
  
  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 5: NORMAL SMOOTHING
  # ════════════════════════════════════════════════════════════════════════════
  #
  # Objective: Smooth normal vector spatially
  # Method: Weighted average with Gaussian kernel
  #   n' = normalize(Σ w_ij · n_j)
  #   w_ij = exp(-‖x_i - x_j‖²/h²)
  #
  # ★ Smooth shading is important
  #
  # ════════════════════════════════════════════════════════════════════════════
  normal_smooth:
    enabled: true
    
    iters: 12                                # Number of smoothing iterations
                                             # More → smoother normal
                                             # Recommended: 3-8
                                          
    
    k: 128                                    # Spatial neighbors
                                             # More → wider range smoothing
    
    lambda_smooth: 0.95                      # EMA blend factor
                                             # n ← λ·n_smooth + (1-λ)·n_old
                                             # Larger → stronger smoothing
                                             # 🔥 0.92 → 0.95 for stronger smoothing
  
  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 6: COVARIANCE CONSTRUCTION
  # ════════════════════════════════════════════════════════════════════════════
  #
  # Objective: Calculate 3D covariance matrix Σ for each Gaussian
  # Method: Use deformation gradient F for anisotropic Gaussian
  #   Σ = R·S·Σ₀·S·Rᵀ
  #   Here F = R·S (polar decomposition)
  #
  # ★ Sparse interpolation (adaptive scaling)
  #
  # ════════════════════════════════════════════════════════════════════════════
  covariance:
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ Base Gaussian Size                                                     │
    # └────────────────────────────────────────────────────────────────────────┘
    sigma0: 0.20                             # Base scale σ₀
                                             # Gaussian base size (isotropic basis)
                                             # Larger → larger Gaussian, smoother, blur
                                             # Smaller → smaller Gaussian, sharper
                                             # Recommended: 0.08-0.12
                                             # 🔥 0.08 too small! 0.16 for perfect coverage
                                             # k=128 smoothing + large Gaussian = smooth surface
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ Condition Number & Eigenvalue Limits (Kerbl et al., 2023)             │
    # └────────────────────────────────────────────────────────────────────────┘
    voxel_size: 0.75                         # Grid voxel size (from grid_dx)
                                             # Used for σ_min/σ_max computation
    
    kappa_max: 40.0                          # Max condition number κ = λ_max/λ_min
                                             # Prevents needle-like splats
                                             # Recommended: 30-50 (Kerbl et al.)
                                             # Higher → more anisotropy allowed
    
    k_F: 32                                  # Number of neighbors for F-field interpolation
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ F-field Processing                                                     │
    # └────────────────────────────────────────────────────────────────────────┘
    use_F_smoothing: true                    # F-field Laplacian smoothing
                                             # Recommended: true (smooth deformation)
    
    use_polar_decomposition: true            # F = R·S decomposition
                                             # Recommended: true (physically meaningful)
    
    use_adaptive_scale: true                 # ★ Sparse interpolation enabled
                                             # Adjust σ based on local density
                                             # Sparse → larger Gaussian,
                                             # Dense → smaller Gaussian,
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ Learnable Covariance                                                   │
    # └────────────────────────────────────────────────────────────────────────┘
    # Physics-guided + Learnable hybrid:
    #   Σ_final = α·Σ_physics + (1-α)·Σ_learnable
    #
    learnable:
      enabled: true                          # Learnable component enabled
      alpha: 0.4                             # Physics ratio (0.4 = 40% physics)
                                             # Higher → physics-centered
                                             # Lower → learning-centered
      
      lr: 0.002                              # Learning rate
      freeze_after_ep: -1                    # Freeze epoch (-1 = never)
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ Density-based Adaptive Scaling                                         │
    # └────────────────────────────────────────────────────────────────────────┘
    # ★★★ Core of automatic sparse interpolation ★★★
    #
    # How it works:
    #   1. Local density ρ calculation (KNN)
    #   2. Sparse detection: ρ < threshold
    #   3. Scale increase: σ = σ₀ × (1 + scale_factor)
    #   4. scale_factor = f(ρ, kappa, max_up)
    #
    density:
      use_scale_prior: true                  # Density-based scaling enabled
      
      scale_kappa: 0.20                      # sensitivity
                                             # inv = ρ^(-κ)
                                             # ρ difference 1.5× → inv difference 1.25× 
                                             # 🔥 0.25 → 0.60: strength to reflect density diff in σ
      
      scale_max_up: 0.25                     # Maximum scale increase (30%)
                                             # σ_max = σ₀ × (1 + 0.30) = 0.16 × 1.30 = 0.208
                                             # Sparse regions: moderate increase
                                             # 🔥 0.25 → 0.30: clearer correction
      
      scale_smooth_alpha: 8.0                # Smoothness factor
                                             # Higher → smoother transitions
                                             # 🔥 5.0 → 4.0: slightly less compression (preserve effect)
      
      allow_shrink: false                    # Allow scale decrease
                                             # false = only grow (prevent holes)
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ Curvature-based Covariance                           │
    # └────────────────────────────────────────────────────────────────────────┘
    curvature_cov:
      enabled: true                          # Curvature-based covariance calculation
      aniso_factor: 1.1                      # Anisotropy strength
      scale_mode: 'adaptive'                 # 'adaptive', 'inverse', 'sqrt_inverse'
      k_neighbors: 128                        # Number of neighbors for curvature calculation
    
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ F-field Graph Laplacian Smoothing                                      │
    # └────────────────────────────────────────────────────────────────────────┘
    # Smooth deformation gradient F in graph
    #
    F_smooth:
      num_nodes: 180                         # Number of nodes in graph
      node_knn: 12                           # Number of connections between nodes
      point_knn: 12                          # Number of connections between points and nodes
      lambda_lap: 0.05                       # Laplacian normalization strength
  
  # ════════════════════════════════════════════════════════════════════════════
  # KNN & PERFORMANCE (Performance optimization)
  # ════════════════════════════════════════════════════════════════════════════
  knn:
    use_faiss: true                          # Use FAISS library (faster)
    use_ivf: true                            # Use IVF index (10-100x faster)
    
    tau: 0.20                                # ★ Soft KNN temperature
                                             # w = exp(-d²/(τ·h²))
                                             # Larger → wider weight distribution
                                             # Recommended: 0.15-0.35 (noisy is higher)
    
    nlist: 100                               # Number of IVF clusters
    nprobe: 10                               # Number of clusters to search
    fallback_chunk_size: 5000                # CPU fallback chunk size
  
  performance:
    use_amp: false                           # Mixed precision (stability first)
    cache_knn: true                          # Cache KNN results
    clear_cache: true                        # Clear cache after pipeline
  
  # ════════════════════════════════════════════════════════════════════════════
  # DEBUG SETTINGS
  # ════════════════════════════════════════════════════════════════════════════
  debug:
    verbose: true                            # Detailed log output
    export_anchor_density: true              # Density map PNG save
    export_anchors: true                     # Anchor visualization save
    export_dir: "debug/"                     # Debug output directory
    png_dpi: 160                             # PNG resolution
    png_ptsize: 0.5                          # Point size

# ════════════════════════════════════════════════════════════════════════════════
# RENDERING CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════
#
# 3D Gaussian Splatting Rendering Configuration
# Upsampling Result to Image
#
# ════════════════════════════════════════════════════════════════════════════════
camera:
  # ──────────────────────────────────────────────────────────────────────────────
  # Image Resolution 
  # ──────────────────────────────────────────────────────────────────────────────
  width: 3840                                # 4K width
  height: 2160                               # 4K height
  
  # ──────────────────────────────────────────────────────────────────────────────
  # Intrinsic Parameters 
  # ──────────────────────────────────────────────────────────────────────────────
  fx: 1425.0                                 # Focal length X (pixels)
  fy: 1425.0                                 # Focal length Y (pixels)
  cx: 1920.0                                 # Principal point X (center)
  cy: 1080.0                                 # Principal point Y (center)
  
  # ──────────────────────────────────────────────────────────────────────────────
  # Depth Clipping 
  # ──────────────────────────────────────────────────────────────────────────────
  znear: 0.01                                # Near plane
  zfar: 100.0                                # Far plane
  
  # ──────────────────────────────────────────────────────────────────────────────
  # Camera Pose 
  # ──────────────────────────────────────────────────────────────────────────────
  # Front-right high angle view 
  #   ┌─────────────────────────────────┐
  #   │   Z↑                            │
  #   │    |     👁️ camera             │
  #   │    |    /                       │
  #   │    |   /                        │
  #   │    |  /                         │
  #   │    | /                          │
  #   │    |/                           │
  #   │    +-------→ X (right)          │
  #   │   /  🐕                         │
  #   │  /                              │
  #   │ -Y (front)                      │
  #   └─────────────────────────────────┘
  #
  lookat:
    eye: [20.0, -30.0, 10.0]                 # Camera position (front-right, above)
                                             # X=15 (right), Y=-18 (FRONT!), Z=20 (above)
    target: [0.0, 0.0, 2.0]                  # Look-at point (slightly above origin)
    up: [0.0, 0.0, 1.0]                      # Up vector (Z-up)

render:
  num_frames: 1                              # Number of frames to render
  schedule: uniform                          # Frame scheduling
  
  # ──────────────────────────────────────────────────────────────────────────────
  # Colors (RGB)
  # ──────────────────────────────────────────────────────────────────────────────
  bg: [1.0, 1.0, 1.0]                        # Background color (white)
  particle_color: [0.27, 0.51, 0.71]         # Particle color (blue)
  
  # Note: Antialiasing (Mip-Splatting) is currently unavailable
  # Alternative solution: sufficient σ (0.16) + condition number limit (κ≤40) + high point density (400k)
  
  # ──────────────────────────────────────────────────────────────────────────────
  # Lighting Model 
  # ──────────────────────────────────────────────────────────────────────────────
  # Phong shading: Ambient + Diffuse + Specular
  #
  lighting:
    model: phong                             # Shading model
                                             # phong = realistic
                                             # flat = simple
                                             # none = no lighting
    
    type: directional                        # Light type (directional/point)
    direction: [0.3, -0.5, 0.8]              # Light direction (normalized)
    two_sided: true                          # Two-sided lighting (backside also bright)
    
    # Intensity components
    ambient: 0.18                            # Ambient light (global brightness)
    diffuse: 0.85                            # Diffuse light (surface brightness)
    specular: 0.10                           # Specular light (highlight)
    shininess: 32                            # Shininess (sharpness)

# ════════════════════════════════════════════════════════════════════════════════
# EPISODE SCHEDULING (Episode-specific parameter override)
# ════════════════════════════════════════════════════════════════════════════════
#
# Progressive refinement strategy:
#   Initial episodes: Strong smoothing + large Gaussian (remove stairs, ensure coverage)
#   Mid episodes: Balanced settings (maintain quality)
#   Late episodes: Light smoothing (preserve detail)
#
# Notation:
#   1-5:  Episodes 1, 2, 3, 4, 5
#   10+:  Episodes 10 or later
#   15:   Episode 15 only
#
# ════════════════════════════════════════════════════════════════════════════════
episode_schedule:
  
  # ────────────────────────────────────────────────────────────────────────────
  # Episodes 1-5: AGGRESSIVE SMOOTHING (Initial - remove stairs)
  # ────────────────────────────────────────────────────────────────────────────
  # Objective: 
  #   - Remove stair现象
  #   - Fill sparse areas completely
  #   - Ensure smooth surface
  #
  1-5:
    upsample:
      sampling:
        M: 500000                            # Standard number of points
        alpha: 0.10                          # Minimum jitter (stability first)
      
      taubin:
        iters: 15                            # Very strong smoothing (15 times)
      
      normal_smooth:
        iters: 8                             # Strong normal smoothing (8 times)
      
    covariance:
        sigma0: 0.20                         # Standard Gaussian size
        
        density:
          scale_kappa: 0.45                  # Very adaptive (sparse sensitive)
          scale_max_up: 0.60                 # Maximum 60% expansion
                                             # In sparse regions: σ = 0.08 × 1.6 = 0.128
  
  # ────────────────────────────────────────────────────────────────────────────
  # Episodes 6-15: MODERATE REFINEMENT (Mid - balanced)
  # ────────────────────────────────────────────────────────────────────────────
  #
  6-15:
    upsample:
      sampling:
        M: 500000                           
        alpha: 0.18                          # Moderate jitter
      
      taubin:
        iters: 10                            # Medium smoothing (10 times)
      
      normal_smooth:
        iters: 6                             # Medium normal smoothing (6 times)
      
      covariance:
        sigma0: 0.20                         # Standard size
        
        density:
          scale_kappa: 0.35                  # Medium adaptivity
          scale_max_up: 0.50                 # 50% expansion
  
  # ────────────────────────────────────────────────────────────────────────────
  # Episodes 16+: MAINTENANCE (Post-refinement - Maintenance)
  # ────────────────────────────────────────────────────────────────────────────
  # Objective:
  #   - Maintain quality
  #   - Preserve detail
  #
  16+:
    upsample:
      sampling:
        alpha: 0.10                          # Natural jitter
      
      taubin:
        iters: 8                             # Light smoothing
      
      normal_smooth:
        iters: 5                             # Light normal smoothing
      
      covariance:
        sigma0: 0.20                         # Standard size
        
        density:
          scale_kappa: 0.30                  # Lower adaptivity