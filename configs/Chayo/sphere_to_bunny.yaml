# PhysMorph-GS: Clean Config (v2.3.2)
# All unused parameters removed

# ════════════════════════════════════════════════════════════════════════════════
# I/O
# ════════════════════════════════════════════════════════════════════════════════
input_mesh_path: "assets/isosphere.obj"
target_mesh_path: "assets/bunny.obj"
output_dir: "output/sphere/bunny/"

# ════════════════════════════════════════════════════════════════════════════════
# Physics Simulation (MPM)
# ════════════════════════════════════════════════════════════════════════════════
simulation:
  grid_dx: 1
  points_per_cell_cuberoot: 2
  grid_min_point: [-16.0, -16.0, -16.0]
  grid_max_point: [16.0, 16.0, 16.0]
  lam: 38888.89
  mu: 58333.3
  density: 75.0
  dt: 0.00833333333
  drag: 0.5
  external_force: [0.0, 0.0, 0.0]
  smoothing_factor: 0.955
  # 🔥 MPM 얇은 구조 안정화 스케줄
  mpm_schedule:
    # 백워드 bulk viscosity (압축 전용, 초반 off → 점진 증가)
    bulk_viscosity:
      - [0, 10, 0.0]               # ep 0-10: off (얇은 구조 자유 학습)
      - [10, 30, 0.1]              # ep 10-30: 약한 억제
      - [30, 999, 0.25]            # ep 30+: 표준 (과도한 압축 억제)
    
    # 백워드 smoothing_factor (EMA 강도, 초반 완화 → 점진 강화)
    smoothing_factor:
      - [0, 10, 0.88]              # ep 0-10: 약한 EMA (새 gradient 잘 전달)
      - [10, 30, 0.92]             # ep 10-30: 중간
      - [30, 999, 0.95]            # ep 30+: 강한 EMA (안정화)
    
    # J-trust region (det(F) 하한, 초반 완화 → 점진 강화)
    j_min:
      - [0, 10, 0.12]              # ep 0-10: 완화 (부피 변화 허용)
      - [10, 30, 0.18]             # ep 10-30: 중간
      - [30, 999, 0.25]            # ep 30+: 엄격 (과도한 압축 방지)

# ════════════════════════════════════════════════════════════════════════════════
# Optimization
# ════════════════════════════════════════════════════════════════════════════════
optimization:
  num_animations: 50
  num_timesteps: 10
  control_stride: 1
  max_gd_iters: 1
  max_ls_iters: 10
  initial_alpha: 0.0001  # ⚡ REDUCED: 100x smaller to allow render gradients to guide!
  gd_tol: 0.0001
  
  # E2E Loss
  loss:
    enabled: true
    w_alpha: 0.5
    w_depth: 0.2
    w_photo: 0.1
    w_edge: 0.1
    w_cov_align: 0.3
    w_cov_reg: 0.01
    w_det_barrier: 0.1         # det(F) barrier (압축 방지)
    cov_reg_mode: 'eigenvalue'
    schedule: 'constant'
  
  # Gradient scaling (render vs physics balance)
  gradient_scaling:
    target_ratio_schedule:
      warmup: 0.10             # ep 0-5
      rampup: 0.25             # ep 5-15
      full: 0.35               # ep 15+
    gain_max: 1000             # ⚡ REDUCED: Prevent render loss degradation!
    ema_beta_initial: 0.5      # 초기 빠른 반응
    ema_beta_stable: 0.8       # 후기 안정
    power_initial: 0.85        # 초기 공격적
    power_stable: 0.75         # 후기 보수적
  
  # PCGrad conflict resolution
  use_pcgrad: true
  pcgrad_threshold: -0.1

# ════════════════════════════════════════════════════════════════════════════════
# Upsampling Pipeline (Simple Mode)
# ════════════════════════════════════════════════════════════════════════════════
upsample:
  # 🔥 Simple pipeline mode
  use_simple_pipeline: true  # Direct F → Covariance (no upsampling)
  
  # Covariance settings
  covariance:
    # 🔥 Target mesh covariance mode
    use_curvature_for_target: true  # true = curvature-based | false = isotropic
    
    # Target mesh (isotropic mode)
    sigma_isotropic: 0.038          # σ² * I when use_curvature_for_target=false
    
    # Target mesh (curvature mode)
    curvature_sigma:
      # 🔥 MODIFIED: Reduce base scales to amplify curvature effect
      sigma_n0: 0.02              # Normal direction scale (was 0.008)
      sigma_t0: 0.03              # Tangent direction scale (was 0.015)
      
      # 🔥 MODIFIED: Increase multipliers for stronger curvature modulation
      a: 12.0                       # Mean curvature multiplier (was 2.0) - AMPLIFY!
      b: 5.0                       # Aniso curvature multiplier (was 0.5) - AMPLIFY!
      
      a_n: 3                     # Normal decay coeff (was 0.5)
      u: 3                       # Normal decay exponent (keep)
      k_floor_normal: 0.002         # Normal floor
      k_floor_tangent: 0.005        # Tangent floor
    
    # Morph (F-based deformation)
    sigma0: 0.10                   # Base scale for morph
    k_F: 32                        # KNN for F interpolation
    sv_min: 0.30                   # Min singular value clamp
    sv_max: null                   # Max singular value (null=unlimited)

# ════════════════════════════════════════════════════════════════════════════════
# Rendering
# ════════════════════════════════════════════════════════════════════════════════
camera:
  width: 3840
  height: 2160
  fx: 1425.0
  fy: 1425.0
  cx: 1920.0
  cy: 1080.0
  znear: 0.01
  zfar: 100.0
  lookat:
    eye: [20.0, -25.0, 12.5]
    target: [0.0, 0.0, 0.0]
    up: [0.0, 0.0, 1.0]

render:
  num_frames: 1
  schedule: uniform
  bg: [1.0, 1.0, 1.0]
  particle_color: [0.27, 0.51, 0.71]
  lighting:
    model: phong
    type: directional
    direction: [0.3, -0.5, 0.8]
    two_sided: true
    ambient: 0.18
    diffuse: 0.85
    specular: 0.10
    shininess: 32

