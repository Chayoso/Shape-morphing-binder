# Option A v1: Target-State Proximal Attractor
# render gradient -> x_target -> L2 attractor (dLdF=0)
# No direct F-space injection
input_mesh_path:  "assets/isosphere.obj"
target_mesh_path: "assets/bunny.obj"
output_dir:       "output/option_a_v1"

simulation:
  grid_dx: 1.0
  grid_min_point: [-16.0, -16.0, -16.0]
  grid_max_point: [16.0, 16.0, 16.0]
  points_per_cell_cuberoot: 6
  lam: 38888.89
  mu:  58333.3
  density: 75.0
  dt: 0.00833333333
  drag: 0.5
  external_force: [0.0, 0.0, 0.0]
  smoothing_factor: 0.955

optimization:
  num_animations: 15
  num_timesteps: 10
  control_stride: 1
  max_gd_iters: 1
  max_ls_iters: 10
  initial_alpha: 0.01
  gd_tol: 0.0001

hard_coupling:
  mode: option_a
  sigma0: auto
  sigma0_scale: 0.5
  opacity: 0.95
  render_start_ep: 5
  # Option A params
  eta: 0.1            # target step size: x_target = x_T - eta * clip(normalize(dLdx))
  lambda_attr: 1.0    # attractor weight: dLdx_attr = 2*lambda*(x_T - x_target)
  tau: 0.5            # clip threshold for normalized gradient
  smooth_k: 8         # KNN neighbors for x_target smoothing (0=disabled)
  loss_weights:
    w_bce: 1.0
    w_iou: 1.0
    w_dt: 0.0
    masked_threshold: 0.01
  regularization:
    w_vol: 1.0
    w_def: 0.1
    w_temp: 0.01

upsample:
  covariance:
    sigma0: 0.08

camera:
  width:  1920
  height: 1080
  fx: 712.5
  fy: 712.5
  cx: 960.0
  cy: 540.0
  znear: 0.01
  zfar:  100.0
  lookat:
    eye:    [20.0, -25.0, 12.5]
    target: [0.0, 0.0, 0.0]
    up:     [0.0, 0.0, 1.0]

render:
  bg: [1.0, 1.0, 1.0]
  training_resolution_scale: 0.5
  particle_color: [0.27, 0.51, 0.71]
  lighting:
    model: phong
    type: directional
    direction: [0.3, -0.5, 0.8]
    two_sided: true
    ambient:   0.18
    diffuse:   0.85
    specular:  0.10
    shininess: 32
