<!DOCTYPE html>
<!-- PhysMorph LIVE viewer: polls /state while the VBD-MPM sim runs on the server.
     Interactive single view: DRAG to rotate, WHEEL to zoom. Splats composited as
     anisotropic GAUSSIAN sprites (projected covariance, back-to-front alpha) -
     an orthographic Gaussian-splat render. Source = blue, target ghost = orange. -->
<html><head><meta charset="utf-8"><title>PhysMorph live</title>
<style>
  body{margin:0;background:#101014;color:#cfd3da;font-family:system-ui,sans-serif;overflow:hidden}
  #bar{position:fixed;left:0;right:0;top:0;padding:8px 14px;background:#000a;z-index:5;
       display:flex;gap:18px;align-items:baseline;font-size:13px}
  #bar b{color:#7fc97f;font-size:15px}
  #bar .dim{color:#8a8f98}
  canvas{display:block;cursor:grab}
  #sparkwrap{position:fixed;right:14px;top:48px;bottom:12px;overflow-y:auto;border-radius:6px}
  #spark{background:#0008;border-radius:6px;display:block}
  #pause{background:#2a6;border:0;color:#fff;padding:3px 10px;border-radius:5px;cursor:pointer}
  #hint{position:fixed;left:14px;bottom:12px;font-size:12px;color:#6b7078}
</style></head>
<body>
<div id="bar">
  <b id="st">connecting…</b>
  <span id="tele" class="dim"></span>
  <button id="pause">pause</button>
  <button id="restart" style="background:#a63;border:0;color:#fff;padding:3px 10px;border-radius:5px;cursor:pointer">restart run</button>
  <span class="dim">splat <input id="ssz" type="range" min="0.4" max="3.0" step="0.1" value="1.5" style="width:80px"></span>
  <span class="dim">ghost <input id="gho" type="range" min="0" max="0.6" step="0.02" value="0.22" style="width:70px"></span>
  <button id="charts" style="background:#456;border:0;color:#fff;padding:3px 10px;border-radius:5px;cursor:pointer">charts</button>
  <label class="dim"><input type="checkbox" id="cbsweep" checked> iters</label>
  <label class="dim"><input type="checkbox" id="cbgrid"> grid</label>
  <label class="dim"><input type="checkbox" id="cbslice"> slice</label>
  <span class="dim">y <input id="ysl" type="range" min="-1" max="1" step="0.02" value="0" style="width:80px"></span>
  <label class="dim"><input type="checkbox" id="cbsplat" checked> splats</label>
  <label class="dim"><input type="checkbox" id="cbfloat"> floaters</label>
  <select id="field" style="background:#222;color:#cfd3da;border:1px solid #444">
    <option value="0">grid |v|</option><option value="1">grid mass</option>
  </select>
</div>
<canvas id="cv"></canvas>
<div id="sparkwrap"><canvas id="histo" width="320" height="110" style="background:#0008;border-radius:6px;display:block;margin-bottom:4px"></canvas><canvas id="spark" width="320" height="1000"></canvas></div>
<div id="hint">drag: rotate · right-drag: pan · wheel: zoom</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const sp = document.getElementById('spark'), spx = sp.getContext('2d');
const $ = id => document.getElementById(id);
let meta = null, target = null, state = null, lastGrid = null, lastCommitHdr = null, lastSeq = -1, paused = false;
let ZOOM = 0.8, PANX = 0, PANY = 0;

// ---- telemetry history: every physical quantity in the state header, per run ----
// MAIN-LINE essentials only (one chart each)
const SERIES = [                     // [key, label, decimals, log10?]
  ['E',        'L total (objective)',   2, true],
  ['phys',     'L_phys+W1 = L − λ·D_render', 2, true],
  ['lamr',     'λ·D_render (render term)', 2, true],
  ['d_dt',     'D_W1 (fringe cleanup)',  4, true],
  ['d_vol',    'D_vol',                 2, false],
  ['d_render', 'D_render',              5, false],
  ['lam',      'λ (render weight)',     0, false],
  ['kin',      'kin  mean|v_T|²',       4, true],
  ['move',     'move / commit',         4, false],
  ['Jmin',     'det F min (whole traj)',3, false],
];
let hist = {};
const resetHist = () => { hist = {}; for (const [k] of SERIES) hist[k] = []; };
resetHist();
function pushHist(h0) {
  const h = {...h0};                 // derived loss terms: the objective decomposition
  if (h.lam != null && h.d_render != null) h.lamr = h.lam * h.d_render;
  if (h.E != null && h.lamr != null) h.phys = h.E - h.lamr;   // D_vol+kin+ctrl+box+W1 side
  for (const [k] of SERIES) {
    if (h[k] != null && isFinite(h[k])) {
      hist[k].push(h[k]);
      if (hist[k].length > 240) hist[k].shift();
    }
  }
}
let showCharts = true;
$('charts').onclick = () => { showCharts = !showCharts; document.getElementById('sparkwrap').style.display = showCharts ? 'block' : 'none'; spark(); };
$('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'resume' : 'pause'; };
$('restart').onclick = () => fetch('/restart', {method: 'POST'});
for (const id of ['ssz', 'gho']) $(id).addEventListener('input', () => draw());
for (const id of ['cbgrid', 'cbsplat', 'field', 'cbslice', 'ysl', 'cbfloat']) $(id).addEventListener('input', () => draw());

// ---- ARCBALL rotation: accumulate a rotation matrix — no Euler angles, no pole
// clamp, full 360 in every direction (the az/el scheme could not pass the poles) ----
function rod(v, k, th) {                        // Rodrigues: rotate v around unit k
  const c = Math.cos(th), s = Math.sin(th);
  const kv = k[0]*v[0]+k[1]*v[1]+k[2]*v[2];
  const cx = [k[1]*v[2]-k[2]*v[1], k[2]*v[0]-k[0]*v[2], k[0]*v[1]-k[1]*v[0]];
  return [v[0]*c + cx[0]*s + k[0]*kv*(1-c),
          v[1]*c + cx[1]*s + k[1]*kv*(1-c),
          v[2]*c + cx[2]*s + k[2]*kv*(1-c)];
}
const norm3 = v => { const n = Math.hypot(...v) || 1; return [v[0]/n, v[1]/n, v[2]/n]; };
const cross3 = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
let CAM = (() => {                               // start ~ (az .6, el -.35)
  const az = 0.6, el = -0.35, ca = Math.cos(az), sa = Math.sin(az),
        ce = Math.cos(el), se = Math.sin(el);
  const right = [ca, 0, -sa], up = [-sa*se, ce, -ca*se];
  return {right, up, fwd: cross3(right, up)};
})();
function basis() { return CAM; }
function rotateCam(dx, dy) {
  const ax = CAM.up, ay = CAM.right;             // rotate about CURRENT screen axes
  for (const key of ['right', 'up', 'fwd']) {
    let v = rod(CAM[key], ax, -dx);
    CAM[key] = rod(v, ay, -dy);
  }
  CAM.right = norm3(CAM.right);                  // re-orthonormalise (drift control)
  CAM.fwd = norm3(cross3(CAM.right, CAM.up));
  CAM.up = norm3(cross3(CAM.fwd, CAM.right));
}
let drag = null, dragMode = 'rot';
cv.addEventListener('contextmenu', e => e.preventDefault());   // right-drag = pan
cv.addEventListener('pointerdown', e => {
  drag = [e.clientX, e.clientY];
  dragMode = (e.button === 2) ? 'pan' : 'rot';                 // Blender-style
  cv.style.cursor = dragMode === 'pan' ? 'move' : 'grabbing';
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  if (dragMode === 'pan') { PANX += e.clientX - drag[0]; PANY += e.clientY - drag[1]; }
  else rotateCam((e.clientX - drag[0]) * 0.006, (e.clientY - drag[1]) * 0.006);
  drag = [e.clientX, e.clientY];
  draw();
});
cv.addEventListener('pointerup', e => { drag = null; cv.style.cursor = 'grab'; });
cv.addEventListener('wheel', e => { e.preventDefault(); ZOOM *= Math.exp(-e.deltaY * 0.001); ZOOM = Math.max(0.2, Math.min(4, ZOOM)); draw(); }, {passive: false});

// ---- Gaussian sprite (radial exp falloff), tinted per cloud ----
function makeSprite(r, g, b) {
  const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  const grad = x.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  for (let t = 0; t <= 1.0001; t += 0.1) {
    const a = Math.exp(-4.5 * t * t);          // ~3 sigma at the sprite edge
    grad.addColorStop(t, `rgba(${r},${g},${b},${a})`);
  }
  x.fillStyle = grad; x.fillRect(0, 0, S, S);
  return c;
}
const SPR_BODY = makeSprite(111, 159, 216);     // source: blue
const SPR_TGT  = makeSprite(224, 149, 107);     // target: warm orange

function parse(buf) {
  const dv = new DataView(buf);
  const hl = dv.getUint32(0, true);
  const hdr = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, hl)));
  const n = hdr.n, a = hdr.a || 0;
  const st = {hdr, x: new Float32Array(buf, 4 + hl, n * 3),
              c6: new Float32Array(buf, 4 + hl + n * 12, n * 6), n, a};
  let off = 4 + hl + n * 36;
  if (a) {
    st.nodes = new Float32Array(buf, off, a * 3);
    st.nodeq = new Float32Array(buf, off + a * 12, a * 2);
    off += a * 20;
  }
  if (hdr.dt_pp) {                                 // per-particle target distance
    st.dtp = new Float32Array(buf, off, n);
  }
  return st;
}

// color ramp (blue -> green -> yellow -> red) for node quantities
function ramp(t) {
  t = Math.max(0, Math.min(1, t));
  const r = Math.min(1, Math.max(0, 2.1 * t - 0.3)), g = Math.min(1, 2 - 2.6 * Math.abs(t - 0.55)),
        b = Math.min(1, Math.max(0, 1.2 - 2.4 * t));
  return `rgba(${(r*255)|0},${(g*255)|0},${(b*255)|0},0.9)`;
}

function drawNodes(st, b, scl, cx, cy, fi) {
  const q = st.nodeq;
  const slice = $('cbslice').checked, y0 = +$('ysl').value * meta.extent;
  let mx = 1e-12, dmin = 1e9, dmax = -1e9;
  const pts = [];
  for (let i = 0; i < st.a; i++) mx = Math.max(mx, q[2*i + fi]);
  for (let i = 0; i < st.a; i++) {
    const X = st.nodes[3*i], Y = st.nodes[3*i+1], Z = st.nodes[3*i+2];
    if (slice && Math.abs(Y - y0) > 0.30) continue;       // one lattice layer (dx 0.5)
    const t = q[2*i + fi] / mx;
    if (!slice && t < 0.03) continue;                     // declutter: near-idle nodes
    const d = X*b.fwd[0]+Y*b.fwd[1]+Z*b.fwd[2];
    dmin = Math.min(dmin, d); dmax = Math.max(dmax, d);
    pts.push([cx + (X*b.right[0]+Y*b.right[1]+Z*b.right[2])*scl,
              cy - (X*b.up[0]+Y*b.up[1]+Z*b.up[2])*scl, t, d]);
  }
  pts.sort((p, q2) => p[3] - q2[3]);
  for (const [px, py, t, d] of pts) {
    const depth = 0.45 + 0.55 * (d - dmin) / Math.max(dmax - dmin, 1e-9);
    ctx.globalAlpha = depth;
    ctx.fillStyle = ramp(t);
    const s = slice ? 7 : 5;
    ctx.fillRect(px - s/2, py - s/2, s, s);
    ctx.strokeStyle = '#0009'; ctx.strokeRect(px - s/2 + 0.5, py - s/2 + 0.5, s - 1, s - 1);
  }
  ctx.globalAlpha = 1;
}

function drawHisto(st, fi) {
  const hx = document.getElementById('histo').getContext('2d');
  hx.fillStyle = '#0008'; hx.fillRect(0, 0, 320, 110);
  if (!st || !st.a) {
    hx.fillStyle = '#8a8f98'; hx.font = '10px system-ui';
    hx.fillText('grid distribution — arrives with each commit', 10, 14);
    return;
  }
  const q = st.nodeq, B = 26, hist = new Array(B).fill(0);
  let mx = 1e-12;
  for (let i = 0; i < st.a; i++) mx = Math.max(mx, q[2*i + fi]);
  for (let i = 0; i < st.a; i++) hist[Math.min(B-1, (q[2*i+fi]/mx*B)|0)]++;
  const hm = Math.max(...hist);
  for (let j = 0; j < B; j++) {
    const h = hist[j] / hm * 80;
    hx.fillStyle = ramp((j + 0.5) / B);
    hx.fillRect(8 + j * 11.6, 100 - h, 10, h);
  }
  hx.fillStyle = '#8a8f98'; hx.font = '10px system-ui';
  hx.fillText(($('field').selectedIndex ? 'grid mass' : 'grid |v| (rest check)') +
              `  max=${mx.toExponential(2)}  cells=${st.a}`, 10, 12);
}

function project(st, b, scl, cx, cy, k) {
  const out = new Array(st.n);
  const r = b.right, u = b.up, f = b.fwd, x = st.x, c6 = st.c6;
  for (let i = 0; i < st.n; i++) {
    const X = x[3*i], Y = x[3*i+1], Z = x[3*i+2];
    const s = c6.subarray(6*i, 6*i+6);
    const S = [[s[0],s[1],s[2]],[s[1],s[3],s[4]],[s[2],s[4],s[5]]];
    const Sr = [S[0][0]*r[0]+S[0][1]*r[1]+S[0][2]*r[2],
                S[1][0]*r[0]+S[1][1]*r[1]+S[1][2]*r[2],
                S[2][0]*r[0]+S[2][1]*r[1]+S[2][2]*r[2]];
    const Su = [S[0][0]*u[0]+S[0][1]*u[1]+S[0][2]*u[2],
                S[1][0]*u[0]+S[1][1]*u[1]+S[1][2]*u[2],
                S[2][0]*u[0]+S[2][1]*u[1]+S[2][2]*u[2]];
    const a11 = r[0]*Sr[0]+r[1]*Sr[1]+r[2]*Sr[2];
    const a12 = u[0]*Sr[0]+u[1]*Sr[1]+u[2]*Sr[2];
    const a22 = u[0]*Su[0]+u[1]*Su[1]+u[2]*Su[2];
    const tr = a11 + a22, det = a11*a22 - a12*a12;
    const disc = Math.sqrt(Math.max(tr*tr/4 - det, 0));
    const l1 = Math.max(tr/2 + disc, 1e-12), l2 = Math.max(tr/2 - disc, 1e-12);
    out[i] = {cx: cx + (X*r[0]+Y*r[1]+Z*r[2])*scl, cy: cy - (X*u[0]+Y*u[1]+Z*u[2])*scl,
              a: k*Math.sqrt(l1)*scl, b2: k*Math.sqrt(l2)*scl,
              th: -0.5*Math.atan2(2*a12, a11-a22), d: X*f[0]+Y*f[1]+Z*f[2]};
  }
  return out;
}

function drawCloud(st, b, scl, cx, cy, sprite, alpha, k) {
  const ell = project(st, b, scl, cx, cy, k);
  ell.sort((p, q) => q.d - p.d);                 // back-to-front alpha compositing
  ctx.globalAlpha = alpha;
  for (const e of ell) {
    const c = Math.cos(e.th), s = Math.sin(e.th);
    const sa = e.a / 32, sb = e.b2 / 32;
    ctx.setTransform(sa*c, sa*s, -sb*s, sb*c, e.cx, e.cy);
    ctx.drawImage(sprite, -32, -32);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
}

function draw() {
  if (!meta || !state) return;
  const W = cv.width = innerWidth, H = cv.height = innerHeight - 40;
  cv.style.marginTop = '40px';
  ctx.fillStyle = '#101014'; ctx.fillRect(0, 0, W, H);
  const b = basis();
  const cx = W / 2 + PANX, cy = H / 2 + PANY, scl = ZOOM * Math.min(W, H) / (2.2 * meta.extent);
  const k = +$('ssz').value, ga = +$('gho').value, fi = +$('field').value;
  if (target && ga > 0) drawCloud(target, b, scl, cx, cy, SPR_TGT, ga, k);
  if ($('cbsplat').checked) drawCloud(state, b, scl, cx, cy, SPR_BODY, 0.85, k);
  if ($('cbgrid').checked && state.a) drawNodes(state, b, scl, cx, cy, fi);
  if ($('cbfloat').checked && state.dtp && meta.nn_sp) {
    const thr = 2.0 * meta.nn_sp, r = b.right, u = b.up;
    ctx.fillStyle = '#ff4040'; ctx.globalAlpha = 0.95;
    for (let i = 0; i < state.n; i++) {
      if (state.dtp[i] <= thr) continue;
      const X = state.x[3*i], Y = state.x[3*i+1], Z = state.x[3*i+2];
      const px = cx + (X*r[0]+Y*r[1]+Z*r[2])*scl, py = cy - (X*u[0]+Y*u[1]+Z*u[2])*scl;
      ctx.beginPath(); ctx.arc(px, py, 3.2, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  drawHisto(state.a ? state : lastGrid, fi);
  ctx.fillStyle = '#666'; ctx.font = '12px system-ui';
  ctx.fillText(`zoom=${ZOOM.toFixed(2)}`, 10, H - 10);
  const h = state.hdr, hc = lastCommitHdr || h;
  const live = h.phase !== 'commit' ? h : hc;      // iter states carry window telemetry
  $('st').textContent = `run ${h.run ?? 0} · commit ${h.commit}/${meta.animations}` +
      (h.phase !== 'commit' ? ` · iter ${h.sweep}` : '');
  $('tele').textContent =
      `L=${fmt(live.E)}  D_vol=${fmt(live.d_vol)}  D_render=${fmt(live.d_render, 5)}  ` +
      `λ=${fmt(live.lam, 0)}  kin=${fmt(live.kin, 4)}  ‖∇L‖=${fmt(live.gnorm)}  ` +
      `Jmin=${fmt(hc.Jmin, 3)}  N=${meta.n}`;
  spark();
}
const fmt = (v, d = 2) => (v == null ? '–' : (+v).toFixed(d));

function spark() {
  if (!showCharts) return;
  const W = 320, RH = 92, PAD = 6;
  sp.height = SERIES.length * (RH + 2) + 6;
  spx.fillStyle = '#000a'; spx.fillRect(0, 0, W, sp.height);
  SERIES.forEach(([k, label, dec, useLog], row) => {
    const y0 = 4 + row * (RH + 2);
    const data0 = hist[k];
    spx.strokeStyle = '#23262c'; spx.strokeRect(4.5, y0 + 0.5, W - 9, RH);
    spx.fillStyle = '#8a8f98'; spx.font = '10px system-ui';
    const last = data0.length ? data0[data0.length - 1] : null;
    spx.fillText(label + (last != null ? '  ' + (+last).toFixed(dec) : '  –'), 10, y0 + 12);
    if (data0.length < 2) return;
    const data = useLog ? data0.map(v => Math.log10(Math.max(v, 1e-12))) : data0;
    const m = Math.max(...data), lo = Math.min(...data);
    spx.strokeStyle = ['#7fc97f', '#c9b17f', '#7fb2c9', '#c97fb0', '#a3c97f',
                       '#c97f7f', '#e0a95f', '#9f8fd8', '#7fc9c2', '#b0b0b0'][row % 10];
    spx.beginPath();
    data.forEach((v, i) => {
      const px = PAD + 4 + i / (data.length - 1) * (W - 2 * PAD - 8);
      const py = y0 + RH - 8 - (v - lo) / Math.max(m - lo, 1e-9) * (RH - 26);
      i ? spx.lineTo(px, py) : spx.moveTo(px, py);
    });
    spx.stroke();
  });
}

async function boot() {
  try {
    meta = await (await fetch('/meta')).json();
    target = parse(await (await fetch('/target')).arrayBuffer());
    const hh = await (await fetch('/history')).json();   // chart backfill after reload
    resetHist();
    for (const h of hh) pushHist(h);
    if (hh.length) lastCommitHdr = hh[hh.length - 1];
    spark();
  } catch (err) {
    $('st').textContent = 'boot error: ' + err;
    $('st').style.color = '#d87f7f';
    setTimeout(boot, 1500);
    return;
  }
  poll();
}
async function poll() {
  try {
    if (!paused) {
      const buf = await (await fetch('/state')).arrayBuffer();
      if (buf.byteLength > 8) {
        const st = parse(buf);
        if (st.hdr.seq !== lastSeq) {
          const isSweep = st.hdr.phase === 'sweep' || st.hdr.phase === 'iter';
          if (!(isSweep && !$('cbsweep').checked)) {   // iteration stream toggleable
            lastSeq = st.hdr.seq;
            if (st.hdr.run !== (state?.hdr.run)) resetHist();
            if (st.a) lastGrid = st;
            state = st;
            if (!isSweep && st.hdr.d_vol != null) { pushHist(st.hdr); lastCommitHdr = st.hdr; }
            draw();
          }
        }
      }
      $('st').style.color = '#7fc97f';
    }
  } catch (err) {
    $('st').textContent = 'disconnected — retrying';
    $('st').style.color = '#d87f7f';
  }
  setTimeout(poll, 150);
}
addEventListener('resize', draw);
boot();
</script>
</body></html>
