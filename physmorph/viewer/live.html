<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhysMorph diagnostics</title>
<style>
:root{color-scheme:dark;--bg:#0d0f14;--panel:#11151de8;--line:#293140;--text:#d8dde7;--dim:#8d96a6}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:12px system-ui,sans-serif;overflow:hidden}
#bar{position:fixed;z-index:5;top:0;left:0;right:0;min-height:43px;padding:7px 10px;background:#07090deF;
 display:flex;gap:12px;align-items:center;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #202633}
#status{font-size:14px;font-weight:700;color:#73d29c} .dim{color:var(--dim)}
button,select,input{accent-color:#5ec79a} button,select{background:#1b2230;color:var(--text);border:1px solid #39445a;border-radius:4px;padding:3px 7px}
button{cursor:pointer} label{cursor:pointer} input[type=range]{width:70px;vertical-align:middle}
#view{position:fixed;left:0;right:0;top:43px;bottom:0;cursor:grab}
#panel{position:fixed;z-index:4;right:10px;top:53px;bottom:10px;width:350px;background:var(--panel);
 border:1px solid #2a3342;border-radius:7px;display:flex;flex-direction:column;box-shadow:0 6px 28px #0008}
#panelHead{padding:8px;border-bottom:1px solid var(--line)} #chartToggles{display:flex;flex-wrap:wrap;gap:5px 9px;max-height:108px;overflow:auto}
#chartToggles label{color:#aeb6c4} #chartScroll{overflow:auto;flex:1} #charts{display:block}
#legend{position:fixed;z-index:3;left:12px;bottom:10px;background:#090c12d9;border:1px solid #293140;border-radius:6px;padding:7px 9px;line-height:1.65}
.sw{display:inline-block;width:13px;height:3px;margin-right:5px;vertical-align:middle}.cyan{background:#40d8ff}.mag{background:#ff5bd6}
  .orange{background:#e0956b}.red{background:#ff4848}.green{background:#66e48f} #tele{color:#aeb6c4}
@media(max-width:900px){#panel{width:300px;opacity:.93}}
</style>
</head>
<body>
<div id="bar">
  <span id="status">connecting</span><span id="tele"></span>
  <button id="pause">pause</button><button id="restart">restart</button><button id="panelBtn">graphs</button>
  <label><input id="iterations" type="checkbox" checked> iterations</label>
  <label><input id="splats" type="checkbox" checked> objective splats</label>
  <label><input id="surfaceOnly" type="checkbox" checked> surface Gaussians</label>
  <label><input id="maskOn" type="checkbox"> render mask</label>
  <label><input id="targetOn" type="checkbox" checked> target</label>
  <label><input id="floaters" type="checkbox"> target-distance tail</label>
  <label><input id="particles" type="checkbox"> particle field</label>
  <select id="particleField"></select>
  <label><input id="gridOn" type="checkbox"> diagnostic grid</label><select id="gridField"></select>
  <label><input id="physGrad" type="checkbox"> physics grad</label>
  <label><input id="renderGrad" type="checkbox"> render grad</label>
  <span class="dim">splat <input id="splatScale" type="range" min=".2" max="3" step=".1" value="1.0"></span>
  <span class="dim">vectors <input id="vectorScale" type="range" min=".2" max="4" step=".1" value="1.2"></span>
</div>
<canvas id="view"></canvas>
<section id="panel">
  <div id="panelHead"><b>Optimization traces</b><div id="chartToggles"></div></div>
  <div id="chartScroll"><canvas id="charts" width="350"></canvas></div>
</section>
<div id="legend">
  <div><span class="sw cyan"></span>physics endpoint -dL/dx</div>
  <div><span class="sw mag"></span>masked render endpoint -dL/dx</div>
  <div><span class="sw orange"></span>target Gaussian ghost</div>
  <div><span class="sw red"></span>target-distance residual (&gt; 2 sample spacings)</div>
  <div><span class="sw green"></span>active render-mask particle</div>
  <div class="dim">drag rotate / right-drag pan / wheel zoom</div>
</div>
<script>

 ['g_cos','post-PCGrad cosine',false,false],['g_share','nominal render share',false,false],
 ['render_work','render endpoint work x+F',false,false],['render_work_x','render work x',false,false],
 ['render_work_F','render work F',false,false],['phys_work','physics endpoint work x+F+v',false,false],

 ['outer_merit','outer merit',false,true],['outer_gain','outer gain',false,false],
 ['outer_gate_latched','outer gate latched',false,false],
 ['reversal_cos','commit reversal cosine',false,false],['Jmin','trajectory min det(F)',false,true],
 ['gauss_condition_p95','Gaussian condition p95',false,true],
 ['gauss_radius_over_spacing_p95','Gaussian radius / spacing p95',false,false],

 ['acc','accepted inner steps',false,false],['rej','rejected inner steps',false,false]

const defaults=new Set(['E','d_vol','d_render','kin','move','g_phys_norm','g_rend_norm','g_raw_cos',

 'support_faded']);
let history={}; for(const [k] of SERIES)history[k]=[];

function isIter(h){return h?.phase==='iter'||h?.phase==='sweep'}

function chartControls(){

 for(const [k,label] of SERIES){const l=document.createElement('label'),c=document.createElement('input');
  c.type='checkbox';c.dataset.key=k;c.checked=defaults.has(k);c.oninput=drawCharts;l.append(c,document.createTextNode(' '+label));box.append(l)}
}

function rod(v,k,t){const c=Math.cos(t),s=Math.sin(t),d=k[0]*v[0]+k[1]*v[1]+k[2]*v[2],

 return[v[0]*c+z[0]*s+k[0]*d*(1-c),v[1]*c+z[1]*s+k[1]*d*(1-c),v[2]*c+z[2]*s+k[2]*d*(1-c)]}
const norm=v=>{const n=Math.hypot(...v)||1;return v.map(x=>x/n)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
let cam=(()=>{const a=.6,e=-.35,r=[Math.cos(a),0,-Math.sin(a)],u=[-Math.sin(a)*Math.sin(e),Math.cos(e),-Math.cos(a)*Math.sin(e)];return{r,u,f:cross(r,u)}})();
function rotate(dx,dy){for(const k of['r','u','f'])cam[k]=rod(rod(cam[k],cam.u,-dx),cam.r,-dy);cam.r=norm(cam.r);cam.f=norm(cross(cam.r,cam.u));cam.u=norm(cross(cam.f,cam.r))}
let drag=null,mode='rot';cv.oncontextmenu=e=>e.preventDefault();cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];mode=e.button===2?'pan':'rot';cv.setPointerCapture(e.pointerId)};

cv.onpointerup=()=>drag=null;cv.onwheel=e=>{e.preventDefault();zoom=Math.max(.18,Math.min(5,zoom*Math.exp(-e.deltaY*.001)));draw()};
function sprite(rgb){const c=document.createElement('canvas');c.width=c.height=64;const z=c.getContext('2d'),g=z.createRadialGradient(32,32,0,32,32,32);

const body=sprite('105,158,222'),tgtSprite=sprite('224,149,107');
function renderState(st){return st?.rn!=null?{n:st.rn,x:st.rx,c6:st.rc6,rw:st.rop}:st}
function project(st,scale,ox,oy,k){

 for(let i=0;i<st.n;i++){const X=st.x[3*i],Y=st.x[3*i+1],Z=st.x[3*i+2],s=st.c6.subarray(6*i,6*i+6),
   finite=Number.isFinite(X)&&Number.isFinite(Y)&&Number.isFinite(Z)&&[...s].every(Number.isFinite);
   if(!finite)continue;
   const
   S=[[s[0],s[1],s[2]],[s[1],s[3],s[4]],[s[2],s[4],s[5]]],
  Sr=[S[0][0]*r[0]+S[0][1]*r[1]+S[0][2]*r[2],S[1][0]*r[0]+S[1][1]*r[1]+S[1][2]*r[2],S[2][0]*r[0]+S[2][1]*r[1]+S[2][2]*r[2]],
  Su=[S[0][0]*u[0]+S[0][1]*u[1]+S[0][2]*u[2],S[1][0]*u[0]+S[1][1]*u[1]+S[1][2]*u[2],S[2][0]*u[0]+S[2][1]*u[1]+S[2][2]*u[2]],
  a=r[0]*Sr[0]+r[1]*Sr[1]+r[2]*Sr[2],b=r[0]*Su[0]+r[1]*Su[1]+r[2]*Su[2],d=u[0]*Su[0]+u[1]*Su[1]+u[2]*Su[2],

let dpr=1;
function cloud(st,scale,ox,oy,spr,alpha,k){const e=project(st,scale,ox,oy,k).sort((a,b)=>b.z-a.z);

function ramp(t){t=Math.max(0,Math.min(1,t));return `hsl(${230-230*t} 90% ${45+12*t}%)`}

  if(!Number.isFinite(X)||!Number.isFinite(Y)||!Number.isFinite(Z)||!Number.isFinite(v)||v<.02)continue;pts.push([ox+(X*cam.r[0]+Y*cam.r[1]+Z*cam.r[2])*scale,oy-(X*cam.u[0]+Y*cam.u[1]+Z*cam.u[2])*scale,v,X*cam.f[0]+Y*cam.f[1]+Z*cam.f[2]])}
 pts.sort((a,b)=>a[3]-b[3]);for(const p of pts){ctx.fillStyle=ramp(p[2]);ctx.globalAlpha=.85;ctx.fillRect(p[0]-3,p[1]-3,6,6)}ctx.globalAlpha=1}
function particleOverlay(st,scale,ox,oy){if(!st?.particleq)return;const fi=+$('particleField').value,vals=[];for(let i=0;i<st.n;i++)vals.push(st.particleq[i*st.pq+fi]);

  const value=st.particleq[i*st.pq+fi];if(!Number.isFinite(X)||!Number.isFinite(Y)||!Number.isFinite(Z)||!Number.isFinite(value))continue;

function arrow(x0,y0,x1,y1,color){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();

function vectors(st,g,scale,ox,oy,color){if(!st||!g)return;const mags=[];for(let i=0;i<st.n;i++)mags.push(Math.hypot(g[3*i],g[3*i+1],g[3*i+2]));const gm=quantile(mags),skip=Math.max(1,Math.ceil(st.n/700)),len=22*(+$('vectorScale').value),r=cam.r,u=cam.u;

  x0=ox+(X*r[0]+Y*r[1]+Z*r[2])*scale,y0=oy-(X*u[0]+Y*u[1]+Z*u[2])*scale,s=len*Math.min(1,m/gm);

function maskOverlay(st,scale,ox,oy,color){if(!st?.rw)return;const r=cam.r,u=cam.u,skip=Math.max(1,Math.ceil(st.n/2500));ctx.strokeStyle=color;ctx.globalAlpha=.85;

function draw(){

const fmt=(v,d=2)=>v==null||!Number.isFinite(+v)?'--':Number(v).toFixed(d);
function drawCharts(){

 chart.height=Math.max(10,enabled.length*rowH);cx2.fillStyle='#0b0e14';cx2.fillRect(0,0,W,chart.height);
 enabled.forEach((k,row)=>{const def=SERIES.find(x=>x[0]===k),data0=history[k],log=def[2],data=log?data0.map(v=>Math.sign(v||1)*Math.log10(Math.max(Math.abs(v),1e-12))):data0,
  top=row*rowH,m=Math.max(...data,1e-12),lo=Math.min(...data,0),last=data0.at(-1);
  cx2.strokeStyle='#293140';cx2.strokeRect(5,top+5,W-10,rowH-10);cx2.fillStyle='#aeb6c4';cx2.font='11px system-ui';cx2.fillText(def[1]+(last==null?'':`  ${last.toPrecision(5)}`),10,top+18);
  if(data.length<2)return;cx2.strokeStyle=`hsl(${(row*47)%360} 72% 65%)`;cx2.beginPath();data.forEach((v,i)=>{const x=10+i/(data.length-1)*(W-20),y=top+rowH-10-(v-lo)/Math.max(m-lo,1e-12)*(rowH-34);i?cx2.lineTo(x,y):cx2.moveTo(x,y)});cx2.stroke()})
}
for(const id of['splats','surfaceOnly','maskOn','targetOn','floaters','particles','particleField','gridOn','gridField','physGrad','renderGrad','splatScale','vectorScale'])$(id).oninput=draw;
$('iterations').oninput=()=>{rebuildHistory();draw()};
$('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'resume':'pause'};$('restart').onclick=()=>fetch('/restart',{method:'POST'});
$('panelBtn').onclick=()=>{showPanel=!showPanel;$('panel').style.display=showPanel?'flex':'none';draw()};
async function loadRun(){meta=await(await fetch('/meta')).json();target=parse(await(await fetch('/target')).arrayBuffer());
 $('surfaceOnly').checked=!!meta.surface_only;$('gridField').innerHTML='';$('particleField').innerHTML='';
 for(const [i,n] of (meta.grid_fields||[]).entries())$('gridField').add(new Option(n,i));for(const [i,n] of (meta.particle_fields||[]).entries())$('particleField').add(new Option(n,i));
 historyRows=await(await fetch('/history')).json();rebuildHistory();lastCommit=lastGrid=null;lastSeq=-1}
async function syncHistory(){const now=performance.now();if(now-lastHistoryFetch<400)return;lastHistoryFetch=now;const rows=await(await fetch('/history')).json();if(Array.isArray(rows)){historyRows=rows;rebuildHistory()}}
async function boot(){try{await loadRun();poll()}catch(e){$('status').textContent='boot error: '+e;setTimeout(boot,1200)}}
async function poll(){try{if(!paused){const b=await(await fetch('/state')).arrayBuffer();if(b.byteLength>8){const s=parse(b);if(s.hdr.run!==meta.run)await loadRun();if(s.hdr.seq!==lastSeq){lastSeq=s.hdr.seq;state=s;if(!isIter(s.hdr))lastCommit=s;if(s.a)lastGrid=s;await syncHistory();draw()}}}}catch(e){$('status').textContent='disconnected; retrying: '+e;$('status').style.color='#ff7373'}setTimeout(poll,150)}
chartControls();addEventListener('resize',draw);boot();
</script>
