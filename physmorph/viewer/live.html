<!DOCTYPE html>
<!-- PhysMorph LIVE viewer: polls /state while the VBD-MPM sim runs on the server.
     Interactive single view: DRAG to rotate, WHEEL to zoom. Splats composited as
     anisotropic GAUSSIAN sprites (projected covariance, back-to-front alpha) -
     an orthographic Gaussian-splat render. Source = blue, target ghost = orange. -->
<html><head><meta charset="utf-8"><title>PhysMorph live</title>
<style>
  body{margin:0;background:#101014;color:#cfd3da;font-family:system-ui,sans-serif;overflow:hidden}
  #bar{position:fixed;left:0;right:0;top:0;padding:8px 14px;background:#000a;z-index:5;
       display:flex;gap:18px;align-items:baseline;font-size:13px}
  #bar b{color:#7fc97f;font-size:15px}
  #bar .dim{color:#8a8f98}
  canvas{display:block;cursor:grab}
  #spark{position:fixed;right:14px;bottom:12px;background:#0008;border-radius:6px}
  #pause{background:#2a6;border:0;color:#fff;padding:3px 10px;border-radius:5px;cursor:pointer}
  #hint{position:fixed;left:14px;bottom:12px;font-size:12px;color:#6b7078}
</style></head>
<body>
<div id="bar">
  <b id="st">connecting…</b>
  <span id="tele" class="dim"></span>
  <button id="pause">pause</button>
  <span class="dim">splat <input id="ssz" type="range" min="0.4" max="3.0" step="0.1" value="1.5" style="width:80px"></span>
  <span class="dim">ghost <input id="gho" type="range" min="0" max="0.6" step="0.02" value="0.22" style="width:70px"></span>
</div>
<canvas id="cv"></canvas>
<canvas id="spark" width="260" height="72"></canvas>
<div id="hint">drag: rotate · wheel: zoom</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const sp = document.getElementById('spark'), spx = sp.getContext('2d');
const $ = id => document.getElementById(id);
let meta = null, target = null, state = null, lastSeq = -1, paused = false;
let dvolHist = [];
let AZ = 0.6, EL = -0.35, ZOOM = 0.8;

$('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'resume' : 'pause'; };
for (const id of ['ssz', 'gho']) $(id).addEventListener('input', () => draw());

// ---- direct manipulation: drag rotates, wheel zooms ----
let drag = null;
cv.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; cv.style.cursor = 'grabbing'; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  AZ += (e.clientX - drag[0]) * 0.006;
  EL = Math.max(-1.45, Math.min(1.45, EL + (e.clientY - drag[1]) * 0.006));
  drag = [e.clientX, e.clientY];
  draw();
});
cv.addEventListener('pointerup', e => { drag = null; cv.style.cursor = 'grab'; });
cv.addEventListener('wheel', e => { e.preventDefault(); ZOOM *= Math.exp(-e.deltaY * 0.001); ZOOM = Math.max(0.2, Math.min(4, ZOOM)); draw(); }, {passive: false});

function basis(az, el) {
  const ca = Math.cos(az), sa = Math.sin(az), ce = Math.cos(el), se = Math.sin(el);
  const right = [ca, 0, -sa], up = [-sa * se, ce, -ca * se];
  const fwd = [right[1] * up[2] - right[2] * up[1], right[2] * up[0] - right[0] * up[2],
               right[0] * up[1] - right[1] * up[0]];
  return {right, up, fwd};
}

// ---- Gaussian sprite (radial exp falloff), tinted per cloud ----
function makeSprite(r, g, b) {
  const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  const grad = x.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  for (let t = 0; t <= 1.0001; t += 0.1) {
    const a = Math.exp(-4.5 * t * t);          // ~3 sigma at the sprite edge
    grad.addColorStop(t, `rgba(${r},${g},${b},${a})`);
  }
  x.fillStyle = grad; x.fillRect(0, 0, S, S);
  return c;
}
const SPR_BODY = makeSprite(111, 159, 216);     // source: blue
const SPR_TGT  = makeSprite(224, 149, 107);     // target: warm orange

function parse(buf) {
  const dv = new DataView(buf);
  const hl = dv.getUint32(0, true);
  const hdr = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, hl)));
  const n = hdr.n;
  return {hdr, x: new Float32Array(buf, 4 + hl, n * 3),
          c6: new Float32Array(buf, 4 + hl + n * 12, n * 6), n};
}

function project(st, b, scl, cx, cy, k) {
  const out = new Array(st.n);
  const r = b.right, u = b.up, f = b.fwd, x = st.x, c6 = st.c6;
  for (let i = 0; i < st.n; i++) {
    const X = x[3*i], Y = x[3*i+1], Z = x[3*i+2];
    const s = c6.subarray(6*i, 6*i+6);
    const S = [[s[0],s[1],s[2]],[s[1],s[3],s[4]],[s[2],s[4],s[5]]];
    const Sr = [S[0][0]*r[0]+S[0][1]*r[1]+S[0][2]*r[2],
                S[1][0]*r[0]+S[1][1]*r[1]+S[1][2]*r[2],
                S[2][0]*r[0]+S[2][1]*r[1]+S[2][2]*r[2]];
    const Su = [S[0][0]*u[0]+S[0][1]*u[1]+S[0][2]*u[2],
                S[1][0]*u[0]+S[1][1]*u[1]+S[1][2]*u[2],
                S[2][0]*u[0]+S[2][1]*u[1]+S[2][2]*u[2]];
    const a11 = r[0]*Sr[0]+r[1]*Sr[1]+r[2]*Sr[2];
    const a12 = u[0]*Sr[0]+u[1]*Sr[1]+u[2]*Sr[2];
    const a22 = u[0]*Su[0]+u[1]*Su[1]+u[2]*Su[2];
    const tr = a11 + a22, det = a11*a22 - a12*a12;
    const disc = Math.sqrt(Math.max(tr*tr/4 - det, 0));
    const l1 = Math.max(tr/2 + disc, 1e-12), l2 = Math.max(tr/2 - disc, 1e-12);
    out[i] = {cx: cx + (X*r[0]+Y*r[1]+Z*r[2])*scl, cy: cy - (X*u[0]+Y*u[1]+Z*u[2])*scl,
              a: k*Math.sqrt(l1)*scl, b2: k*Math.sqrt(l2)*scl,
              th: -0.5*Math.atan2(2*a12, a11-a22), d: X*f[0]+Y*f[1]+Z*f[2]};
  }
  return out;
}

function drawCloud(st, b, scl, cx, cy, sprite, alpha, k) {
  const ell = project(st, b, scl, cx, cy, k);
  ell.sort((p, q) => q.d - p.d);                 // back-to-front alpha compositing
  ctx.globalAlpha = alpha;
  for (const e of ell) {
    const c = Math.cos(e.th), s = Math.sin(e.th);
    const sa = e.a / 32, sb = e.b2 / 32;
    ctx.setTransform(sa*c, sa*s, -sb*s, sb*c, e.cx, e.cy);
    ctx.drawImage(sprite, -32, -32);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
}

function draw() {
  if (!meta || !state) return;
  const W = cv.width = innerWidth, H = cv.height = innerHeight - 40;
  cv.style.marginTop = '40px';
  ctx.fillStyle = '#101014'; ctx.fillRect(0, 0, W, H);
  const b = basis(AZ, EL);
  const cx = W / 2, cy = H / 2, scl = ZOOM * Math.min(W, H) / (2.2 * meta.extent);
  const k = +$('ssz').value, ga = +$('gho').value;
  if (target && ga > 0) drawCloud(target, b, scl, cx, cy, SPR_TGT, ga, k);
  drawCloud(state, b, scl, cx, cy, SPR_BODY, 0.85, k);
  ctx.fillStyle = '#666'; ctx.font = '12px system-ui';
  ctx.fillText(`az=${AZ.toFixed(2)} el=${EL.toFixed(2)} zoom=${ZOOM.toFixed(2)}`, 10, H - 10);
  const h = state.hdr;
  $('st').textContent = `run ${h.run ?? 0} · commit ${h.commit}/${meta.animations}`;
  $('tele').textContent =
      `E=${fmt(h.E)}  D_vol=${fmt(h.d_vol)}  D_render=${fmt(h.d_render, 5)}  ` +
      `λ=${fmt(h.lam, 0)}  sweeps=${h.sweeps ?? '–'}  Jmin=${fmt(h.Jmin, 3)}  N=${meta.n}`;
  spark();
}
const fmt = (v, d = 2) => (v == null ? '–' : (+v).toFixed(d));

function spark() {
  spx.fillStyle = '#0008'; spx.fillRect(0, 0, 260, 72);
  if (dvolHist.length < 2) return;
  const m = Math.max(...dvolHist), lo = Math.min(...dvolHist);
  spx.strokeStyle = '#7fc97f'; spx.beginPath();
  dvolHist.forEach((v, i) => {
    const px = 8 + i / (dvolHist.length - 1) * 244;
    const py = 62 - (v - lo) / Math.max(m - lo, 1e-9) * 50;
    i ? spx.lineTo(px, py) : spx.moveTo(px, py);
  });
  spx.stroke();
  spx.fillStyle = '#8a8f98'; spx.font = '10px system-ui';
  spx.fillText('D_vol ' + fmt(dvolHist[dvolHist.length - 1]), 10, 12);
}

async function boot() {
  try {
    meta = await (await fetch('/meta')).json();
    target = parse(await (await fetch('/target')).arrayBuffer());
  } catch (err) {
    $('st').textContent = 'boot error: ' + err;
    $('st').style.color = '#d87f7f';
    setTimeout(boot, 1500);
    return;
  }
  poll();
}
async function poll() {
  try {
    if (!paused) {
      const buf = await (await fetch('/state')).arrayBuffer();
      if (buf.byteLength > 8) {
        const st = parse(buf);
        if (st.hdr.seq !== lastSeq) {
          lastSeq = st.hdr.seq;
          if (st.hdr.run !== (state?.hdr.run)) dvolHist = [];
          state = st;
          if (st.hdr.d_vol != null) { dvolHist.push(st.hdr.d_vol); if (dvolHist.length > 120) dvolHist.shift(); }
          draw();
        }
      }
      $('st').style.color = '#7fc97f';
    }
  } catch (err) {
    $('st').textContent = 'disconnected — retrying';
    $('st').style.color = '#d87f7f';
  }
  setTimeout(poll, 150);
}
addEventListener('resize', draw);
boot();
</script>
</body></html>
