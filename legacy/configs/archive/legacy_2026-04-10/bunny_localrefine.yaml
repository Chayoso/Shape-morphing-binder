        num_iters: 4
        lr: 0.010
        w_smooth: 0.03
        w_l2: 0.002
        max_disp: 0.45
        z_min_frac: 0.55
        score_percentile: 88
        bbox_padding: 1.25
        active_margin: 0.75
        max_extent_frac: 0.42
        min_extent_frac: 0.24

  - name: bunny_localref_bdlr12_delay8
    target_mesh_path: "assets/bunny.obj"
    correction:
      local_refine:
        enabled: true
