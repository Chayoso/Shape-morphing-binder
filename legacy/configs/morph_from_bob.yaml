output_base: "output/morph_from_bob"

defaults:
  input_mesh_path: "assets/bob.obj"

  simulation:
    grid_min_point: [-16.0, -16.0, -16.0]
    grid_max_point: [16.0, 16.0, 16.0]
    grid_dx: 0.5
    gravity: [0.0, 0.0, 0.0]
    dt: 0.004166666667
    smoothing: 0.955
    boundary: none
    points_per_cell_cuberoot: 5
    shell_sampling:
      enabled: true
      surface_points_per_cell_cuberoot: 5
      interior_points_per_cell_cuberoot: 1
      shell_thickness_cells: 2.0
      apply_jitter: true

  optimization:
    num_animations: 60
    num_timesteps: 20
    control_point_freq: 1
    max_gd_iters: 1
    initial_alpha: 0.01
    final_alpha: 0.01

  render:
    sigma0: auto
    sigma0_scale: 0.7
    bg: [1.0, 1.0, 1.0]
    training_resolution_scale: 0.5
    opacity: 0.95
    particle_color: [0.27, 0.51, 0.71]

  plasticity:
    eta: 0.0
    chamfer_eta: 0.0
    chamfer_start_ep: 20
    adaptive_eta_max: 5.0
    damping: 0.1
    plasticity_J_min: 0.5
    plasticity_J_max: 1.5
    smooth_k: 64
    diffusion_iters: 3

  surface_aware:
    enabled: true
    recon_resolution: 64
    recon_padding: 2.0
    recon_sigma: 1.5
    recon_level_ratio: 0.02
    surface_threshold_mult: 1.75
    min_surface_frac: 0.10
    max_surface_frac: 0.35
    render_surface_threshold_mult: 2.25
    render_min_surface_frac: 0.36
    render_max_surface_frac: 0.60
    chamfer_mask_threshold: 1.0

  surface_proxy:
    enabled: false

  control_guidance:
    enabled: false

  render_F_gain: 0.1

  covariance_opt:
    enabled: false

  multi_view:
    enabled: true
    preset: ring
    num_cameras: 8

  loss_weights:
    adaptive_grad_match: true
    grad_match_scale_min: 0.0
    grad_match_scale_max: 1000.0
    w_dt: 1.0
    w_bce: 0.2
    w_iou: 0.5
    w_depth: 1.0
    grad_ratio_iou: 0.25
    grad_ratio_depth: 0.15
    grad_ratio_dt: 1.0
    dt_blur_sigma_start: 0.0
    dt_blur_sigma_end: 0.0
    dt_curriculum_eps: 0
    masked_threshold: 0.01
    mv_hardmax_w: 1.0
    mv_topk_w: 1.0
    mv_topk_frac: 0.25

  camera:
    width: 1920
    height: 1080
    fx: 712.5
    fy: 712.5
    cx: 960.0
    cy: 540.0
    znear: 0.01
    zfar: 100.0
    lookat:
      eye: [20.0, -25.0, 12.5]
      target: [0.0, 0.0, 0.0]
      up: [0.0, 0.0, 1.0]

experiments:
  - name: "bob_to_spot"
    target_mesh_path: "assets/spot.obj"
    plasticity:
      chamfer_eta: 0.05
      chamfer_start_ep: 20

  - name: "bob_to_bunny"
    target_mesh_path: "assets/bunny.obj"
    plasticity:
      chamfer_eta: 0.05
      chamfer_start_ep: 20

  - name: "bob_to_teapot"
    target_mesh_path: "assets/teapot.obj"
    plasticity:
      chamfer_eta: 0.05
      chamfer_start_ep: 20

  - name: "bob_to_isosphere"
    target_mesh_path: "assets/isosphere.obj"
    plasticity:
      chamfer_eta: 0.05
      chamfer_start_ep: 20

