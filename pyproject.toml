[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physmorph"
version = "3.0.0"
description = "Render-guided differentiable MPM shape morphing, settled transport (Warp + torch + CuPy, CUDA only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "warp-lang>=1.9",
  "torch>=2.5",
  "cupy-cuda12x>=13",   # the run stage: device KD-tree and ndimage (CUDA 12 NVRTC)
  "numpy",
  "scipy",
  "trimesh",
  "scikit-image",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib", "pillow", "rtree"]

[tool.setuptools.packages.find]
include = ["physmorph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
